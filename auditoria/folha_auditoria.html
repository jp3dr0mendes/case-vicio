<script>
const ITEMS=[{"id": "Q0359", "texto": "Aos crimes cometidos contra idosos, cuja pena máxima privativa de liberdade não ultrapasse quatro anos, aplica-se o procedimento previsto na Lei nº 9.099/1995, e, subsidiariamente, no que couber, as disposições do Código Penal e do Código de Processo Penal. O STF, contudo, vedou, nesses casos, a possibilidade de que fossem aplicadas quaisquer das medidas despenalizadoras previstas na Lei nº 9.099/1995.", "comando": "Sobre o caso acima, assinale a afirmativa correta.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0067", "texto": "Os fi ns da Administração Pública resumem-se em um único objetivo: o bem comum da coletividade administrativa. Toda atividade deve ser orientada para este objetivo; sendo que todo ato administrativo que não for praticado no interesse da coletividade será ilícito e imoral. Assim, temos no Código Penal o título XI - Dos crimes contra a Administração Pública. Analise a conduta abaixo, caracterizando-a com um dos tipos de crime contra a Administração Pública. Sebastião, policial militar, exige dinheiro de Caio, usuário de maconha, para que este não seja preso. Caio, com medo da função de policial exercida pelo funcionário público militar, dá R$ 4.000,00 (quatro mil reais) a Sebastião, conforme exigido por ele. Com base nessa informação e na legislação penal especial, é correto afi rmar que:", "comando": "Analise a conduta e caracterize-a com um dos tipos de crime contra a Administração Pública.", "alternativas": ["A) Sebastião comete o crime de corrupção ativa.", "B) Sebastião comete o crime de prevaricação.", "C) Sebastião comete o crime de excesso de exação.", "D) Sebastião comete o crime de concussão.", "E) Sebastião comete o crime de patrocínio infiel."]}, {"id": "Q0268", "texto": "Assinale a alternativa correta:", "comando": "Assinale a alternativa correta.", "alternativas": ["A) São requisitos do tipo, no crime de falsidade ideológica: 1) alteração da verdade sobre fato juridicamente relevante; 2) imitação da verdade; 3) potencialidade do dano; 4) dolo.", "B) O uso de documento falso não é crime formal e sua caracterização depende da ocorrência de um resultado naturalístico específico e determinado.", "C) A persecução do crime de \"abuso de autoridade\" somente se procede mediante queixa do ofendido.", "D) Não é punível a calúnia contra os mortos.", "E) A exceção da verdade, nos crimes contra a honra, é cabível, indistintamente, tanto na calúnia, quanto na injúria e na difamação."]}, {"id": "Q0214", "texto": "Patrick foi denunciado e condenado, em primeira instância, perante a 1ª Vara Criminal de Florianópolis, pela prática de crime de corrupção passiva. Após a condenação, dentro do prazo legal, apresentou o recurso cabível, que se encontra pendente de julgamento. Nesse período, foi novamente denunciado pela prática do crime de corrupção passiva, dessa vez perante a 2ª Vara Criminal de Florianópolis, sendo verificado pelo teor da denúncia que os fatos imputados são os mesmos daquela ação da 1ª Vara Criminal. A defesa técnica de Patrick, poderá apresentar, ao responder a segunda ação penal, a exceção de:", "comando": "", "alternativas": ["A) incompetência do juízo, que deverá ser processada nos autos principais;", "B) coisa julgada, que deverá ser processada em autos apartados;", "C) coisa julgada, que suspenderá o andamento da ação penal;", "D) litispendência, que deverá ser processada em autos apartados;", "E) suspeição, que precederá a qualquer outra eventualmente oposta."]}, {"id": "Q0080", "texto": "Com relação às teorias da criminologia e à prevenção da infração penal no estado democrático de direito, julgue o item subsequente acerca dos modelos de reação ao delito. O cumprimento dos deveres legais por parte do apenado recluso constitui instrumento de reação ao delito analisado pelo modelo restaurador: o real impacto do castigo aplicado ao indivíduo no caso concreto é capaz de aferir os diagnósticos e de proporcionar adequadas soluções para prevenir a reincidência.", "comando": "Julgue o item subsequente acerca dos modelos de reação ao delito.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0023", "texto": "Sobre o Tribunal do Júri, é INCORRETO afirmar:", "comando": "", "alternativas": ["A) Seu procedimento desdobra-se em juízo da acusação, que analisa a admissibilidade da pretensão punitiva, e juízo da causa, que diz respeito ao mérito da acusação.", "B) Se o acusado houver permanecido preso durante a instrução criminal, a pronúncia do juiz importará em automática manutenção da cautela extrema, sendo, por outro lado, necessária a motivação do decreto de prisão na hipótese de o pronunciado encontrar-se solto.", "C) A decisão de impronúncia não faz coisa julgada formal e material.", "D) Se o advogado do acusado, regularmente intimado, não comparecer à sessão de julgamento, e não houver escusa legítima, o julgamento será adiado uma única vez, cabendo ao juiz-presidente intimar a Defensoria Pública para o novo julgamento.", "E) Nos termos da lei, o sistema de colheita de depoimentos em plenário é, para as partes, o do exame direto e cruzado, ao passo que, para os jurados, o sistema é o indireto, ou presidencialista."]}, {"id": "Q0173", "texto": "Com relação à regressão de regime prisional e às faltas disciplinares, assinale a opção correta com base no disposto na LEP e no entendimento dos tribunais superiores.", "comando": "Assinale a opção correta com base no disposto na LEP e no entendimento dos tribunais superiores.", "alternativas": ["A) A falta disciplinar de natureza grave cometida pelo executando acarreta o reinício do cômputo do interstício necessário ao preenchimento do requisito objetivo para a concessão do benefício da progressão de regime bem como a perda total do tempo remido.", "B) Segundo os princípios da estrita legalidade e da anterioridade, consideram-se faltas disciplinares, classificadas em leves, médias, graves e gravíssimas, apenas as que sejam previstas expressamente na LEP e que sejam anteriores à prática do fato.", "C) Admite-se a regressão de regime prisional, com a transferência para qualquer dos regimes mais rigorosos, quando o condenado frustrar os fins da execução ou não pagar a multa cumulativamente imposta.", "D) Considera-se falta média a inobservância, pelo condenado à pena privativa de liberdade, do dever de obediência ao servidor e do respeito a qualquer pessoa com quem se relacione no ambiente prisional, bem como do dever de cumprir as ordens recebidas.", "E) A autoridade administrativa é detentora do poder disciplinar exercido sobre o preso na execução das penas restritivas de direitos, podendo, em caso de falta grave do sentenciado, suspender-lhe automaticamente o direito às saídas temporárias e decidir pela regressão de regime, ouvido previamente o condenado."]}, {"id": "Q0315", "texto": "Paulo, nascido em 15/8/1996, foi denunciado em 24/5/2020, pela prática do crime de roubo majorado tentado, que teria sido praticado em 7/4/2016. Recebida a denúncia em 30/5/2020, Paulo foi condenado a uma pena de 2 anos e 9 meses pela prática delitiva em 20/10/2021, tendo a condenação transitado em julgado em 1/12/2021. Nessa situação, a prescrição, segundo a jurisprudência atual do STF,", "comando": "Considerando os dados apresentados, analise a prescrição aplicável ao caso de Paulo.", "alternativas": ["A) já teria ocorrido antes do oferecimento da denúncia.", "B) ocorrerá em 2 anos após o trânsito em julgado da condenação, quer para a defesa quer para a acusação.", "C) ocorrerá em 4 anos após o trânsito em julgado da condenação, tanto para a defesa quanto para a acusação.", "D) ocorrerá em 6 anos após o trânsito em julgado da condenação para a defesa e para a acusação.", "E) ocorrerá em 8 anos após o trânsito em julgado da condenação, tanto para a defesa quanto para a acusação."]}, {"id": "Q0208", "texto": "Lucas foi denunciado por infringir o art. 121, § 2.º, inciso II (homicídio qualificado por motivo fútil), do CP, por ter disparado arma de fogo contra Mauro, levando-o a óbito. Na denúncia, consta que Lucas e seu irmão Carlos estavam em um bar na comarca de Pacajus, onde, em dado momento, Carlos discutiu com Mauro. A discussão acabou resultando em luta corporal. O dono do bar afirmou que a discussão se deu porque Carlos se recusou a pagar uma bebida para Mauro; Lucas acudiu o irmão e Mauro, estando sozinho, foi embora, mas retornou, minutos depois, com uma faca do tipo peixeira na mão. O dono do bar afirmou que chegou a trancar a porta, tentando evitar a tragédia, mas a vítima conseguiu arrombá-la, entrou no bar e partiu para cima de Carlos com a peixeira em riste. O depoente viu que Lucas sacou um revólver e atirou duas vezes, atingindo Mauro na altura do tórax. Vendo-o caído, Lucas fugiu do local e escondeu-se em uma mata, onde foi encontrado doze horas depois, ainda com a arma do crime. A vítima foi socorrida no hospital municipal e, no dia seguinte, foi transferida para o Hospital Geral de Fortaleza, onde, devido à gravidade dos ferimentos, faleceu depois de ser submetida a cirurgia. Considerando a situação hipotética acima descrita, julgue os itens subseqüentes.", "comando": "Lucas foi o autor de homicídio e Carlos figurou como partícipe do crime", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0266", "texto": "Em operação conjunta de garantia da Lei e da Ordem, de iniciativa do Presidente da República, com militares do Exército e membro da Polícia Militar estadual, ocorre a morte de um civil. Existem indícios da prática de um crime doloso contra a vida, sendo que há suspeita da participação de um soldado do Exército Brasileiro e um soldado da Polícia Militar estadual neste fato. Nesse caso, é correto afirmar que a competência para o eventual julgamento é", "comando": "Assinale a alternativa correta.", "alternativas": ["A) da Justiça Militar da União, para o Militar do Exército, e do Tribunal do Júri, para o Policial Militar estadual. \\n", "B) da Justiça Militar da União, para o Militar do Exército, e da Justiça Militar dos Estados, para o Policial Militar estadual. \\n", "C) do Tribunal do Júri, para ambos. \\n", "D) da Justiça Federal, para o Militar do Exército, e do Tribunal do Júri, para o Policial Militar estadual. \\n", "E) da Justiça Militar da União, para ambos, em razão da conexão. \\n"]}, {"id": "Q0021", "texto": "Sobre o Juiz das Garantias e o entendimento do STF no julgamento de ações diretas de inconstitucionalidade, julgue o item a seguir. O STF fixou o prazo, improrrogável, de doze meses, a contar da publicação da ata do julgamento, para que sejam adotadas as medidas legislativas e administrativas necessárias à adequação das diferentes leis de organização judiciária, à efetiva implantação e ao efetivo funcionamento do juiz das garantias em todo o país, tudo conforme as diretrizes do Conselho Nacional de Justiça e sob a supervisão dele.", "comando": "Julgue o item a seguir.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0301", "texto": "NÃO admite perdão judicial:", "comando": "Complete a frase indicando os casos em que não se admite perdão judicial.", "alternativas": ["A) a lesão corporal culposa causada na direção de veículo automotor.", "B) a utilização de meio de transporte sem recursos para efetuar o pagamento.", "C) a guarda doméstica de pássaro silvestre cuja espécie não é considerada ameaçada de extinção.", "D) a retorsão imediata à difamação, que consista em outra difamação."]}, {"id": "Q0340", "texto": "Assinale a alternativa correta sobre o concurso de pessoas.", "comando": "", "alternativas": ["A) Admite-se a participação por omissão em crime comissivo,\\nquando o omitente devia e podia agir para\\nevitar o resultado, mas não se admite em crimes\\nomissivos, por induzimento ou instigação.", "B) Para que se admita a concorrência de culpas no crime\\nculposo, é necessário que cada agente atue com\\nconsciência de que está colaborando com a conduta\\nculposa de outrem.", "C) A pena será agravada em relação ao agente que instiga\\nou determina a cometer o crime alguém sujeito à\\nsua autoridade ou não punível em virtude de condição ou qualidade pessoal.", "D) Se a participação for de menor importância, a pena\\npode ser diminuída de um sexto a dois terços.", "E) As condições e circunstâncias pessoais do agente\\nnão se comunicam ao coautor ou partícipe ainda que\\ncircunstâncias elementares ao crime."]}, {"id": "Q0311", "texto": "Considere que um oficial de justiça não tenha localizado o réu, para realizar a citação pessoal na ação penal, no endereço que constava dos autos. Nesse caso,", "comando": "", "alternativas": ["A) o oficial de justiça deverá proceder à citação por hora certa, a ser cumprida, no máximo, em três dias.", "B) o juiz decretará a revelia do réu e dará seguimento à ação penal.", "C) será feita a citação por edital e, caso o réu não compareça, a ação penal ficará suspensa.", "D) será citada a Defensoria Pública para realizar a defesa técnica do réu.", "E) a falta de citação pessoal interromperá o prazo prescricional até a localização do réu."]}, {"id": "Q0191", "texto": "Considere as seguintes afirmações a respeito dos recursos no Código de Processo Penal: I. Recurso de caráter subsidiário, cabível de decisão que denegar recurso. II. Recurso pelo qual se procede ao reexame da decisão do juiz, nas matérias especificadas em lei, permitindo-se-lhe novo pronunciamento antes do julgamento pela instância superior.", "comando": "Estas afirmações referem-se, respectivamente, a", "alternativas": ["A) agravo e reclamação.", "B) reclamação e correição parcial.", "C) recurso em sentido estrito e apelação.", "D) carta testemunhável e recurso em sentido estrito.", "E) embargos e correição parcial."]}, {"id": "Q0071", "texto": "Nos crimes contra a Flora, previstos na Lei n. 9.605/98, a pena é majorada no patamar de um sexto a um terço se: do fato resulta a diminuição de águas naturais, a erosão do solo ou a modificação do regime climático; e o crime é cometido: no período de queda das sementes; no período de formação de vegetações; contra espécies raras ou ameaçadas de extinção, ainda que a ameaça ocorra somente no local da infração; em época de seca ou inundação; e durante a noite, em domingo ou feriado.", "comando": "Assinale a alternativa correta.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0350", "texto": "Assinale a opção correta acerca dos crimes de lavagem ou ocultação de bens, direitos e valores.", "comando": "", "alternativas": ["A) Em razão do fenômeno da consunção, não é possível a\\nautolavagem, isto é, a imputação simultânea, ao mesmo réu,\\nda infração antecedente e do crime de lavagem.", "B) Por constituir crime unissubsistente, a tentativa é impunível.", "C) Em caso de colaboração espontânea do agente com as\\nautoridades, mediante esclarecimentos relevantes para a\\napuração da materialidade ou da autoria/participação no\\ncrime nos termos da lei, a pena poderá ser reduzida de um a\\ndois terços e ser cumprida em regime aberto ou semiaberto,\\nfacultadas ainda ao órgão julgador a concessão do perdão\\njudicial ou a substituição da pena, a qualquer tempo, por pena\\nrestritiva de direitos.", "D) Desde a entrada em vigor da Lei n.º 9.613/1998, a legislação\\npenal brasileira pode ser classificada como legislação de\\nterceira geração, ao considerar que qualquer infração penal\\npode figurar como delito antecedente da lavagem de capitais."]}, {"id": "Q0198", "texto": "A moderna teoria do domínio do fato de Claus Roxin procura solucionar alguns problemas de autoria e, expressamente, já foi adotada em nossos tribunais. Além das previsões legais sobre autoria mediata, existe a possibilidade de autoria no âmbito de uma organização. Para que esta seja configurada devem estar presentes alguns requisitos, EXCETO", "comando": "Assinale o requisito que não é necessário para configurar a autoria no âmbito de uma organização.", "alternativas": ["A) poder efetivo de mando.", "B) fungibilidade do autor imediato.", "C) desvinculação do aparato organizado do ordenamento jurídico.", "D) o prévio acerto entre o comandante e os demais comandados.", "E) disponibilidade consideravelmente elevada por parte do executor."]}, {"id": "Q0034", "texto": "A situação em que o habeas corpus é medida de impugnação cabível é", "comando": "Complete a frase sobre a situação em que o habeas corpus é medida de impugnação cabível.", "alternativas": ["A) para trancar processo em curso por infração penal em que a pena pecuniária seja a única cominada.", "B) para que o advogado consiga ter acesso aos autos de inquérito policial.", "C) contra a decisão que inadmite assistente de acusação.", "D) para se pedir o desentranhamento de prova ilícita dos autos de inquérito policial ou de ação penal.", "E) para se obter restituição de coisas apreendidas."]}, {"id": "Q0344", "texto": "Quanto à Lei nº 9.605/1998, que dispõe sobre as sanções penais e administrativas derivadas de condutas e atividades lesivas ao meio ambiente, é correto afirmar:", "comando": "Assinale a alternativa correta.", "alternativas": ["A) Os animais apreendidos serão entregues a jardins zoológi cos , fundações ou ent idades assemelhadas, independentemente de ficarem sob a responsabilidade de técnicos habilitados.", "B) Tratando-se de produtos perecíveis ou madeiras, estes irão a hasta pública, sendo o resultado depositado emfavor do meio ambiente.", "C) Os produtos e subprodutos da fauna perecíveis serão preservados como prova do crime.", "D) Os instrumentos utilizados na prática da infração serão vendidos , garantida a sua descaracterização por meio da reciclagem.", "E) Nas infrações penais previstas nessa lei, a ação penal é pública condicionada à representação."]}, {"id": "Q0010", "texto": "Com relação aos crimes contra o meio ambiente, assinale a opção correta, conforme entendimento do STJ e do STF.", "comando": "Assinale a opção correta, conforme entendimento do STJ e do STF.", "alternativas": ["A) Considere que Gil, a fim de comemorar, durante a madrugada, em zona urbana, a vitória de determinado time de futebol, tenha ajustado o aparelho de som do veículo em volume muito acima do limite permitido na legislação local, perturbando o sono e o sossego da vizinhança, e que esta tenha acionado o órgão municipal responsável. Considere, ainda, que o referido aparelho de som tenha sido apreendido, e Gil, conduzido à delegacia de polícia. Nessa situação, a conduta de Gil é atípica, visto que a poluição sonora não está expressamente prevista na lei de crimes ambientais.", "B) O crime ambiental que consiste em impedir o nascimento de nova vegetação ou dificultar a regeneração natural de florestas e demais formas de vegetação é crime permanente, visto que a consumação do delito se protrai no tempo, violando o bem jurídico tutelado de forma contínua e duradoura, renovando-se, a cada momento a consumação, consoante entendimento do STF.", "C) Em se tratando dos crimes contra o meio ambiente, admite-se responsabilização penal unicamente da pessoa jurídica, salvo se a imputação for pela prática de delitos culposos.", "D) Os tribunais superiores, no que concerne aos crimes ambientais, rejeitam a incidência do sistema da dupla imputação ou sistema da imputação paralela dada a ocorrência de bis in idem na responsabilização, pelo mesmo crime, de mais de uma pessoa.", "E) O crime de deixar de cumprir obrigação de relevante interesse ambiental, previsto no rol dos crimes contra a administração pública ambiental, é crime omissivo próprio, punido apenas na forma dolosa, e se caracteriza quando o agente público deixa de praticar o ato, contrariando o dever legal de fazê-lo para evitar o resultado lesivo ao meio ambiente, consoante entendimento do STJ."]}, {"id": "Q0145", "texto": "Considerando as alterações provocadas pela Lei nº 12.683, de 09 de julho de 2012, no tocante aos crimes de lavagem de capitais e, ainda, aos crimes contra a ordem tributária, analise as assertivas e identifique com V as verdadeiras e com F as falsas. ( ) A ocultação ou dissimulação de bens de posse ilícita, tais como drogas ou armas, ainda que produtos de determinada infração, não constitui crime de lavagem de capitais, porque os autores podem ser punidos pelos crimes de forma distinta e autônoma. ( ) O crime de lavagem de capitais é tipificado quando há demonstração de que os bens, direitos ou valores objeto de ocultação ou dissimulação são produtos, diretos ou indiretos, de infração penal. ( ) Se a infração penal antecedente for um crime contra a ordem tributária, o objeto material da lavagem de capitais será o total do valor que gere a obrigação tributária. ( ) Não se pode confundir o crime de favorecimento real com o crime de lavagem de capitais, uma vez que o primeiro (favorecimento real) não pode ser praticado pelo autor ou partícipe da infração antecedente, vez que o próprio tipo penal se caracteriza pelo auxílio destinado a tornar seguro o proveito do crime, fora dos casos de coautoria ou de receptação. ( ) Toda e qualquer infração penal poderá caracterizar-se como antecedente da lavagem de capitais, a exemplo dos chamados crimes de responsabilidade (infrações político-administrativas) e, ainda, bens, direitos ou valores oriundos de improbidade administrativa. A alternativa que contém a sequência correta, de cima para baixo, é", "comando": "Identifique a sequência correta de V e F para as assertivas apresentadas, de cima para baixo.", "alternativas": ["A) V F V F V", "B) V F V V F", "C) V V F V F", "D) F V F V F", "E) F F V F V"]}, {"id": "Q0193", "texto": "Sobre o tema da colaboração premiada, assinale a alternativa incorreta :", "comando": "Assinale a alternativa incorreta sobre o tema da colaboração premiada.", "alternativas": ["A) O acordo de colaboração premiada poderá ser precedido de instrução, quando houver necessidade de\\nidentificação ou complementação de seu objeto, dos fatos narrados, sua definição jurídica, relevância,\\nutilidade e interesse público.", "B) Na hipótese de não ser celebrado o acordo por iniciativa do celebrante, esse não poderá se valer de\\nnenhuma das informações ou provas apresentadas pelo colaborador, de boa-fé, para qualquer outra\\nfinalidade.", "C) Considerando a relevância da colaboração prestada, o Ministério Público ou a autoridade policial\\npoderão, a qualquer tempo, requerer ou representar ao juiz pela concessão de perdão judicial ao\\ncolaborador, ainda que esse benefício não tenha sido previsto na proposta inicial.", "D) O juiz poderá, a requerimento das partes, conceder o perdão judicial, reduzir em até 2/3 (dois terços) a\\npena privativa de liberdade ou substituí-la por restritiva de direitos daquele que tenha colaborado efetiva e\\nvoluntariamente com a investigação e com o processo criminal, se dessa colaboração vier a identificação\\ndos demais coautores e partícipes da organização criminosa e das infrações penais por eles praticadas.", "E) O prazo para oferecimento de denúncia ou o processo, relativos ao colaborador, poderá ser suspenso\\npor até 6 (seis) meses, prorrogáveis por igual período, até que sejam cumpridas as medidas de colaboração,\\nsuspendendo-se o respectivo prazo prescricional."]}, {"id": "Q0212", "texto": "Julgue o item subsequente, em relação à prova, ao instituto da interceptação telefônica e à citação por hora certa. Em processo penal, a citação por hora certa do réu que se oculte para não ser citado segue os procedimentos previstos no Código de Processo Civil, de modo que, caso o réu não compareça em juízo nem constitua advogado, ficam suspensos o processo e o curso do prazo prescricional, podendo o juiz, se for o caso, determinar a produção antecipada de provas consideradas urgentes.", "comando": "", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0204", "texto": "Em relação à lei processual penal no tempo, vigora o princípio do efeito imediato, segundo o qual tempus regit actum. De acordo com tal princípio, as normas processuais penais têm aplicação imediata, mas consideram-se válidos os atos processuais realizados sob a égide da lei anterior.", "comando": "Explique o princípio do efeito imediato na lei processual penal.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0319", "texto": "A co-autoria é impossível nos crimes: I. Culposos; II. Unissubsistentes; III. Habitual ou de mera conduta.", "comando": "Complete a frase indicando em quais crimes a co-autoria é impossível.", "alternativas": ["A) Comissivos.", "B) Omissivos.", "C) Próprios.", "D) De mão própria.", "E) Culposos"]}, {"id": "Q0046", "texto": "Acerca das nulidades processuais e dos vícios procedimentais, assinale a alternativa correta.", "comando": "Assinale a alternativa correta.", "alternativas": ["A) As nulidades processuais penais sofrem influência da\\ninstrumentalidade do processo, não se declarando\\nqualquer tipo de nulidade se não verificado o prejuízo.", "B) Segundo a jurisprudência do Superior Tribunal de\\nJustiça, a inversão da ordem das perguntas (art. 212,\\nCPP) não gera nulidade, não implicando afronta ao\\nprincípio do contraditório.", "C) As nulidades são divididas conforme a gravidade dos\\nvícios, em relativas e absolutas, sendo a nulidade de ordem\\nabsoluta reconhecida ainda que não haja prejuízo.", "D) A inépcia da acusação só pode ser apreciada na fase do\\nartigo 396, do Código de Processo Penal, não podendo\\ntal análise ser refeita na fase do artigo 397, do Código\\nde Processo Penal, após a resposta à acusação.", "E) A coisa julgada sana todas as hipóteses de nulidades\\nprocessuais penais."]}, {"id": "Q0076", "texto": "A Criminologia é definida tradicionalmente como a ciência que estuda de forma empírica o delito, o delinquente, a vítima e os mecanismos de controle social. Os autores que fundaram a Criminologia (Positivista) são:", "comando": "Assinale a alternativa correta.", "alternativas": ["A) Cesare Lombroso, Enrico Ferri e Raffaele Garofalo.", "B) Franz Von Liszt, Edmund Mezger e Marquês de Beccaria.", "C) Marquês de Beccaria, Cesare Lombroso e Michel Foucault.", "D) Cesare Lombroso, Enrico Ferri e Michel Foucault.", "E) Enrico Ferri, Michel Foucault e Nina Rodrigues."]}, {"id": "Q0029", "texto": "Nos termos da Lei nº 13.869/2019, configura crime de abuso de autoridade", "comando": "Complete a frase ou explique o que configura crime de abuso de autoridade segundo a Lei nº 13.869/2019.", "alternativas": ["A) deixar de entregar ao preso, imediatamente, a nota\\nde culpa, assinada pela autoridade, com o motivo da\\nprisão e os nomes do condutor e das testemunhas.", "B) prosseguir com o interrogatório de pessoa que tenha\\noptado por ser assistida por advogado, sem a presença de seu patrono.", "C) submeter a pessoa, presa em flagrante, a interrogatório policial, durante o período de repouso noturno.", "D) impedir a entrevista pessoal e reservada do preso\\ncom seu advogado, ainda que de modo justificado.", "E) adentrar, mediante consentimento do ocupante, imóvel alheio ou suas dependências, ou nele permanecer\\nnas mesmas condições, sem determinação judicial."]}, {"id": "Q0327", "texto": "Em uma ação penal por crime ocorrido em 04/03/2023, o réu, ao ser interrogado, confessa espontaneamente, perante o juiz, a prática do delito que lhe é imputado. Na folha de antecedentes criminais do acusado, constam as seguintes anotações, devidamente esclarecidas por certidões cartorárias: I. condenação transitada em julgado em 08/06/2016 por crime anterior, praticado em 06/02/2014, com pena de reclusão extinta em 15/03/2022, diante do término do livramento condicional, cujo período de prova se iniciara em 14/08/2017; II. condenação transitada em julgado em 02/09/2022 por contravenção penal anterior, praticada em 07/01/2022, com pena de prisão simples cumprida em 03/03/2023; e III. ação penal em curso, por crime posterior, praticado em 05/03/2024. À luz das informações apresentadas, conclusos os autos ao juiz para sentença, no dia de hoje, na segunda fase da dosimetria da pena, a pena deverá ser", "comando": "À luz das informações apresentadas, conclusos os autos ao juiz para sentença, no dia de hoje, na segunda fase da dosimetria da pena, a pena deverá ser aplicada considerando os antecedentes criminais mencionados.", "alternativas": ["A) atenuada, incidindo a atenuante da confissão espontânea, sendo o réu primário.", "B) atenuada, preponderando a atenuante da confissão espontânea sobre a agravante da reincidência.", "C) mantida, compensando-se integralmente a atenuante da confissão espontânea com a agravante da reincidência.", "D) agravada, compensando-se proporcionalmente a agravante da reincidência com a atenuante da confissão espontânea.", "E) agravada, preponderando a agravante da reincidência, sem qualquer compensação em relação à atenuante da confissão espontânea."]}, {"id": "Q0307", "texto": "Determinado policial militar efetuou a prisão em flagrante de Luciano e o conduziu à delegacia de polícia. Lá, com o objetivo de fazer Luciano confessar a prática dos atos que ensejaram sua prisão, o policial responsável por seu interrogatório cobriu sua cabeça com um saco plástico e amarrou-o no seu pescoço, asfixiando-o. Como Luciano não confessou, o policial deixou-o trancado na sala de interrogatório durante várias horas, pendurado de cabeça para baixo, no escuro, período em que lhe dizia que, se ele não confessasse, seria morto. O delegado de polícia, ciente do que ocorria na sala de interrogatório, manteve-se inerte. Em depoimento posterior, Luciano afirmou que a conduta do policial lhe provocara intenso sofrimento físico e mental. Considerando a situação hipotética acima e o disposto na Lei Federal n.º 9.455/1997, julgue o item subsequente. O delegado não pode ser considerado coautor ou partícipe da conduta do policial, pois o crime de tortura somente pode ser praticado de forma comissiva.", "comando": "Julgue o item subsequente.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0079", "texto": "Em relação aos sistemas processuais penais e aos seus princípios reitores, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": ["A) A efetividade da repressão criminal do sistema acusatório\\ncabe especialmente ao órgão julgador, responsável pela\\naplicação da pena no caso concreto.", "B) No sistema acusatório, o legislador admite que a\\nimparcialidade judicial esteja comprometida com um objetivo\\nconsiderado mais importante.", "C) O modelo ideal de sistema acusatório é previsto em\\ninstrumento normativo internacional, a partir de critérios\\nuniformes definidos pela doutrina processual.", "D) A crítica ao sistema inquisitivo está relacionada à sua falta de\\nrigor quanto à certeza de repressão dos fatos contrários à\\nordem social.", "E) A decisão sobre o sistema que deverá ser implantado em\\ndeterminado país pressupõe uma definição prévia, por parte\\ndo legislador, de alguns critérios de política criminal, entre os\\nquais está o grau de eficiência da repressão."]}, {"id": "Q0103", "texto": "A respeito da revisão criminal, julgue os próximos itens. A revisão criminal, que é um dos aspectos diferenciadores do mero direito à defesa e do direito à ampla defesa, este caracterizador do direito processual penal, tem por finalidade o reexame do processo já alcançado pela coisa julgada, de forma a possibilitar ao condenado a absolvição, a melhora de sua situação jurídica ou a anulação do processo.", "comando": "Julgue os próximos itens sobre a revisão criminal.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0308", "texto": "Inquérito policial arquivado pelo Ministério Público por ausência de elementos suficientes de informação importa", "comando": "", "alternativas": ["A) coisa julgada material.", "B) ilegitimidade ad causam.", "C) ilegitimidade ad processum.", "D) ausência de justa causa processual em sentido estrito.", "E) prescrição da pretensão punitiva estatal."]}, {"id": "Q0232", "texto": "Sobre os crimes contra a Administração da Justiça, previstos no Código Penal, assinale a alternativa correta.", "comando": "", "alternativas": ["A) Dar causa a ação de improbidade administrativa, imputando a alguém ato improbo de que sabe inocente, valendo-se de nome suposto, em tese, caracteriza o crime de denunciação caluniosa.", "B) O crime de exercício arbitrário das próprias razões, previsto no artigo 345, do CP, somente se procede mediante queixa.", "C) Oferecer dinheiro a testemunha para fazer afirmação falsa em depoimento, em tese, caracteriza o crime de coação no curso do processo, previsto no artigo 344, do CP.", "D) O crime de exploração de prestígio (art. 357, do CP) é próprio, podendo ser praticado apenas pelos sujeitos previstos no tipo penal.", "E) O crime de favorecimento pessoal caracteriza-se pelo auxílio prestado a autor de crime, a fim de que ele escape da ação das autoridades públicas, desde que o crime praticado seja punido com reclusão."]}, {"id": "Q0291", "texto": "Quando se tratar de crimes relativos ao tráfico de drogas, o prazo para a conclusão do inquérito policial é de 30 dias, se o indiciado estiver preso e de 90 dias, se estiver solto, podendo ser duplicados, mediante pedido justificado da autoridade de polícia judiciária.", "comando": "Explique os prazos para a conclusão do inquérito policial em crimes relativos ao tráfico de drogas.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0282", "texto": "Assinale a alternativa correta :", "comando": "Assinale a alternativa correta.", "alternativas": ["A) Nos termos do § 1º do art. 19 da Lei n.º 11.340/06, as medidas protetivas de urgência poderão ser concedidas de imediato, observada a prévia manifestação do representante do Ministério Público.", "B) O ato de comercializar emblemas que utilizem a cruz suástica ou gamada, ainda que sem a finalidade de divulgação do nazismo, constitui o crime previsto no art. 20, § 1º, da Lei n.º 7.716/89.", "C) Ceder, gratuitamente, arma de fogo, acessório ou munição, de uso permitido, sem autorização e em desacordo com determinação legal ou regulamentar, não tipifica a conduta penal de que trata o art. 14 do Estatuto do Desarmamento.", "D) O art. 28 da Lei n.º 10.826/03 veda, em qualquer hipótese, ao menor de 25 anos, a aquisição de arma de fogo.", "E) Constatada a prática de violência doméstica e familiar contra a mulher, segundo as disposições expressas na Lei n.º 11.340/06, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, entre as medidas protetivas de urgência, a de restrição ou suspensão de visitas aos dependentes menores, nesta hipótese ouvida a equipe de atendimento multidisciplinar ou serviço similar."]}, {"id": "Q0006", "texto": "Sobre os crimes de furto e roubo , analise as afirmativas a seguir. I. De acordo com a teoria da contrectatio , a consumação do crime de furto ocorre quando há o contato físico com a coisa alheia móvel, desde que haja a inversão da posse. II. Há delito de furto e não de roubo quando o sujeito ativo se vale de narcóticos para reduzir a vítima à impossibilidade de resistência para se apoderar dos pertences dela. III. Não é cabível tentativa de roubo impróprio.", "comando": "Está correto o que se afirma em", "alternativas": ["A) III, apenas.", "B) I e II, apenas.", "C) I e III, apenas.", "D) II e III, apenas.", "E) I, II e III."]}, {"id": "Q0056", "texto": "No caso de pluralidade delitiva, deve-se adotar, na determinação da pena,", "comando": "Complete a frase sobre a determinação da pena no caso de pluralidade delitiva.", "alternativas": ["A) o sistema de cúmulo jurídico, somando-se as penas aplicadas\\na cada um dos crimes.", "B) o sistema da exasperação, quando se tratar de casos de\\nconcurso formal imperfeito.", "C) o sistema da exasperação, quando se tratar de concurso\\nmaterial heterogêneo, para evitar que a pena ultrapasse o limite\\nlegal de cumprimento.", "D) o sistema da exasperação, que considera tão somente o número\\nde crimes consumados para definição da pena.", "E) o sistema do cúmulo material, quando se tratar de pena\\npecuniária, independentemente das demais sanções aplicadas,\\nressalvado o crime continuado."]}, {"id": "Q0314", "texto": "O habeas corpus é", "comando": "Complete a frase sobre o habeas corpus.", "alternativas": ["A) ação de natureza constitucional destinada a coibir qual- quer ilegalidade ou abuso de poder contra a liberdade de locomoção.", "B) recurso previsto na Constituição Federal para evitar atentado na liberdade de ir e vir ou no direito líquido e certo.", "C) remédio constitucional, de caráter liberatório, destinado a coibir qualquer coação ilegal na sua liberdade de ir e vir ou evitar a consumação de uma ilegalidade, por ato de autoridade ou de particular.", "D) medida de caráter liberatório que tem por finalidade obter reforma de decisão judicial, com apreciação de novas provas."]}, {"id": "Q0041", "texto": "Sobre as medidas de segurança é correto afirmar:", "comando": "", "alternativas": ["A) A lógica manicomial se funda na segregação hospitalar da pessoa com transtorno mental que tenha praticado um injusto\\npenal para sua neutralização e tentativa declarada de cura.", "B) O Código Penal adota o sistema do duplo binário, sem a possibilidade de aplicação simultânea de pena e medida de segurança, que só se aplicam sucessivamente.", "C) Pelo regime adotado no Código Penal, a medida de segurança pode ser aplicada ao imputável, desde que presente a periculosidade.", "D) É inaplicável o Estatuto da Pessoa com Deficiência (Lei n° 13.146/2015) aos inimputáveis por doença mental, pois seria\\numa aplicação indevida do positivismo criminológico considerá-los pessoas com deficiência.", "E) Segundo a Lei n° 10.216/2001, a desinternação é sempre condicional, podendo ser restabelecida se dentro de um ano o\\nagente praticar fato indicativo de persistência de sua periculosidade."]}, {"id": "Q0084", "texto": "Sobre a assistência à mulher em situação de violência doméstica e familiar prevista na Lei Maria da Penha, analise as assertivas abaixo e assinale a alternativa correta. I. Será assegurado pelo juiz a manutenção do vínculo trabalhista por até seis meses da mulher em situação de violência doméstica e familiar quando for necessário o afastamento do local de trabalho. II. A mulher em situação de violência doméstica e familiar tem prioridade para matricular seus dependentes em instituição de educação básica mais próxima de seu domicílio mediante a apresentação dos documentos comprobatórios do registro da ocorrência policial ou do processo de violência doméstica e familiar em curso. III. É de responsabilidade exclusiva das vítimas em situação de violência doméstica e familiar ressarcir ao Sistema Único de Saúde (SUS), de acordo com a tabela SUS, os custos relativos aos serviços de saúde prestados.", "comando": "Assinale a alternativa correta.", "alternativas": ["A) Todas as assertivas estão corretas.", "B) Todas as assertivas estão incorretas.", "C) Apenas a assertiva I está correta.", "D) Apenas a assertiva III está correta.", "E) Apenas as assertivas I e II estão corretas."]}, {"id": "Q0205", "texto": "Assinale a alternativa correta.", "comando": "", "alternativas": ["A) Dar-se-á carta testemunhável da decisão que denegar o recurso.", "B) O Ministério Público pode desistir de recurso que haja interposto desde que se trate de crime de menor potencial ofensivo.", "C) Réu que teve declarada extinta a punibilidade por prescrição pode recorrer pedindo decisão de mérito da acusação.", "D) A apelação da sentença absolutória impede que o réu seja posto imediatamente em liberdade."]}, {"id": "Q0225", "texto": "A partir das disposições legais e da jurisprudência dos tribunais superiores acerca de temas relacionados à execução penal, julgue o item a seguir. Pedro foi denunciado pela prática de latrocínio e, embora tenha alegado em seu interrogatório que estava a negócios em outra cidade no dia e na hora do fato descrito na denúncia, ele foi condenado. A defesa interpôs recurso de apelação ao tribunal de justiça, com fundamento na insuficiência probatória, porém a corte estadual manteve na íntegra a condenação. O STJ, sem fazer qualquer incursão no mérito, não conheceu do recurso especial defensivo, com fundamento no enunciado da sua Súmula n.º 7. Após o trânsito em julgado da condenação, a defesa produziu, em juízo, prova nova que comprovava cabalmente o álibi de Pedro. Nessa situação, é do STJ a competência para processamento e julgamento da ação de revisão criminal com vistas à absolvição de Pedro, pois, de acordo com a Constituição Federal de 1988, cabem àquela corte as revisões criminais de seus próprios julgados.", "comando": "Julgue o item a seguir.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0317", "texto": "O direito de representação deve ser exercido no prazo de seis meses contados a partir da data do fato, uma vez que o ofensor foi identificado nessa ocasião, sob pena de decadência.", "comando": "Explique o prazo para o exercício do direito de representação no contexto apresentado.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0091", "texto": "Em cada item que se segue, é apresentada uma situação hipotética seguida de uma assertiva a ser julgada com base na legislação de regência e na jurisprudência dos tribunais superiores a respeito de aplicação de pena, cominação de penas, regime de penas, medidas de segurança e livramento condicional. Flávio, maior e capaz, condenado a pena de doze anos pela prática de homicídio doloso qualificado, iniciou o cumprimento da pena em regime fechado. Durante a execução da pena, ele apresentou comportamento excelente e colaborativo, por isso, após o período mínimo para a progressão de regime, seu advogado requereu ao juiz a passagem de Flávio para o regime aberto. Nessa situação, o pedido não poderá ser atendido: a progressão do regime prisional de Flávio deverá ser para o regime semiaberto.", "comando": "Julgue a assertiva apresentada na situação hipotética.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0150", "texto": "Considerando o entendimento sumulado dos Tribunais Superiores, analise as assertivas abaixo e assinale a alternativa: I - A majorante do tráfico transnacional de drogas (art. 40, inciso I, da Lei n. 11.343/2006) configura-se com a prova da destinação internacional das drogas, ainda que não consumada a transposição de fronteiras. II - Para a incidência da majorante prevista no art. 40, inciso V, da Lei n. 11.343/2006, é desnecessária a efetiva transposição de fronteiras entre estados da Federação, sendo suficiente a demonstração inequívoca da intenção de realizar o tráfico interestadual. III - É cabível a aplicação retroativa da Lei n. 11.343/2006, desde que o resultado da incidência das suas disposições, na íntegra, seja mais favorável ao réu do que o advindo da aplicação da Lei n. 6.368/1976, sendo vedada a combinação de leis. IV - A causa de aumento de pena prevista no art. 40, inciso III, da Lei n. 11.343/2006 tem natureza objetiva, devendo haver portanto comprovação de mercancia a menos de duzentos metros da respectiva entidade de ensino.", "comando": "Analise as assertivas e assinale a alternativa correta.", "alternativas": ["A) Todas as alternativas estão corretas.", "B) Apenas a alternativa I está correta.", "C) Apenas a alternativa II está incorreta.", "D) Apenas a alternativa III está correta.", "E) Apenas a alternativa IV está incorreta."]}, {"id": "Q0218", "texto": "João da Silva vai à agência bancária obter o levantamento de conta de FGTS de terceiro, usando documento falso. Desconfiado da veracidade do documento, o gerente da agência pede a João que retorne em algumas horas, quando o dinheiro já estará disponível em sua conta. João retorna no horário combinado e, no momento em que efetua o saque, é preso por policiais militares acionados pelo gerente da agência após proceder à checagem da autenticidade do referido documento e confirmar sua falsidade.", "comando": "Considerando essa narrativa, assinale a afirmativa correta.", "alternativas": ["A) A prisão em flagrante é ilegal, pois se trata de flagrante provocado.", "B) A prisão em flagrante é legal, pois se trata de ação controlada.", "C) A prisão em flagrante é legal, pois se trata de flagrante diferido.", "D) A prisão em flagrante é legal, pois se trata de flagrante preparado.", "E) A prisão em flagrante é legal, pois se trata de flagrante esperado."]}, {"id": "Q0063", "texto": "No contexto da violência doméstica e familiar contra a mulher, avalie se as afirmativas a seguir são verdadeiras (V) ou falsas (F). ( ) As medidas protetivas de urgência, previstas na Lei nº 11.340/2006, poderão ser aplicadas cumulativamente, diferentemente das medidas cautelares alternativas dispostas no Código de Processo Penal, as quais não podem ser aplicadas de forma cumulada, tendo em vista o princípio ne bis in idem . ( ) Independentemente de autorização judicial, o delegado de polícia, quando o município não for sede de comarca, poderá tomar medidas para o imediato afastamento do agressor do local de convivência com a ofendida. ( ) As medidas protetivas de urgência serão concedidas em juízo de cognição sumária a partir do depoimento da ofendida perante a autoridade policial ou a partir da apresentação de suas alegações escritas. ( ) Segundo a Lei nº 11.340/06, as medidas protetivas de urgência poderão ser concedidas de imediato, independentemente de audiência das partes e de manifestação do Ministério Público. Todavia, o órgão do Parquet deverá ser comunicado prontamente sobre a medida. As afirmativas são, respectivamente,", "comando": "Assinale se as afirmativas são verdadeiras (V) ou falsas (F).", "alternativas": ["A) F – V – V – F.", "B) V – F – V – F.", "C) F – V – V – V.", "D) V – F – F – V.", "E) F – V – F – F."]}, {"id": "Q0156", "texto": "De acordo com a Lei n° 9.605/98, que dispõe sobre sanções penais e administrativas derivadas de condutas e atividades lesivas ao meio ambiente,", "comando": "Complete a questão conforme o enunciado.", "alternativas": ["A) a suspensão condicional da pena pode ser aplicada nos casos de condenação a pena privativa de liberdade não superior a 2 (dois) anos.", "B) aplicável à pessoa jurídica a pena restritiva de direitos de suspensão parcial de atividades, vedada a suspensão total.", "C) o baixo grau de instrução ou escolaridade do agente é causa de isenção da pena.", "D) constitui pena de interdição temporária de direito a proibição de o condenado contratar com o Poder Público pelo prazo de 3 (três) anos, no caso de crimes culposos.", "E) não é crime o abate de animal em razão de seu caráter nocivo, a critério do Magistrado."]}, {"id": "Q0081", "texto": "Acerca das Escolas da Criminologia, assinale (V) para a afirmativa verdadeira e (F) para a falsa. ( ) A Escola Clássica da Criminologia tem, como objeto principal de estudo, o crime como um ente jurídico. ( ) A Escola da Criminologia Positivista tinha como principais adeptos Cesare Beccaria, Enrico Ferri e Raffaele Garofalo. ( ) A Escola da Criminologia Crítica recebe influência da Teoria do Labelling Approach . As afirmativas são, respectivamente,", "comando": "Assinale (V) para a afirmativa verdadeira e (F) para a falsa.", "alternativas": ["A) V – V – V.", "B) V – V – F.", "C) F – V – V.", "D) V – F – V.", "E) F – F – V."]}, {"id": "Q0111", "texto": "Sobre a escola positivista da criminologia, é correto afirmar:", "comando": "Assinale a alternativa correta.", "alternativas": ["A) A escola positivista ainda não chega a considerar a concepção da pena como meio de defesa social, que é própria de\\nescolas mais modernas da criminologia.", "B) Sua recepção no Brasil recebeu contornos racistas, notadamente no trabalho antropológico de Nina Rodrigues.", "C) É uma escola criminológica ultrapassada e que já influenciou a legislação penal brasileira, mas que após a Constituição\\nFederal de 1988 não conta mais com institutos penais influenciados por esta corrente.", "D) Por ter enveredado pela sociologia criminal, Enrico Ferri não é considerado um autor da escola positivista, que possui viés\\nmédico e antropológico.", "E) O método positivista negava a importância da pesquisa empírica, que possivelmente a levaria a resultados diversos\\ndaqueles encontrados pelos seus autores."]}, {"id": "Q0151", "texto": "No que diz respeito às prisões e medidas cautelares no processo penal, assinale a alternativa CORRETA:", "comando": "Assinale a alternativa correta.", "alternativas": ["A) O juiz poderá substituir a prisão preventiva pela domiciliar quando o suposto autor do fato delituoso for maior de 70 (setenta) anos de idade ou estiver extremamente debilitado por motivo de doença grave.", "B) Em respeito ao princípio da proporcionalidade das medidas cautelares, a fiança, segundo as regras do Código de Processo Penal, quando estabelecida em seu valor máximo, não poderá ser cumulada com outras medidas cautelares diversas da prisão preventiva.", "C) Se assim recomendar a situação econômica do preso, a fiança poderá ser aumentada em até 1.000 (mil) vezes.", "D) De acordo com o novo regramento destinado à prisão cautelar, o Código de Processo Penal passou a estabelecer a prisão temporária como uma das hipóteses das denominadas prisões cautelares estritamente processuais.", "E) É pacífico o entendimento da doutrina quanto à natureza jurídica precautelar da prisão em flagrante, o que tem sido confirmado pela jurisprudência do Superior Tribunal de Justiça."]}, {"id": "Q0110", "texto": "Sobre a competência em matéria processual penal é correto afirmar que:", "comando": "Assinale a alternativa correta.", "alternativas": ["A) compete ao juizo da infãncia e da juventude, em razão do principio da proteção integral, o processamento e julgamento de réu, maior de 18 (dezoito) anos, que pratique crime de estupro de vulnerável (art. 217-A, do Código Penal).", "B) no crime de peculato-desvio, compete ao foro do local para o qual foram destinados os recursos desviados, e não ao foro do local onde efetivamente ocorreu o desvio de recursos públicos, o processamento e julgamento da respectiva ação penal.", "C) tanto pelo Supremo Tribunal Federal, como também pelo Superior Tribunal de Justiça, constitui jurisprudência sumulada que o foro competente para o processo e o julgamento dos crimes de estelionato, sob a modalidade da emissão dolosa de cheque sem provisão de fundos, é o do local onde o agente aufere a vantagem indevida.", "D) nos processos por crime contra a honra, em que for querelante pessoa detentora de foro especial por prerrogativa de função, quando oposta e admitida a exceção da verdade, será esta última julgada pelo julzo especial, que teria competencia para julgar a suposta vítima do crime contra honra (querelante)."]}, {"id": "Q0269", "texto": "Assinale a alternativa que NÃO SE AJUSTA à doutrina do garantismo penal, em sua concepção clássica:", "comando": "Assinale a alternativa que NÃO SE AJUSTA à doutrina do garantismo penal, em sua concepção clássica", "alternativas": ["A) A interpretação da lei nunca é uma atividade exclusivamente recognitiva, mas é sempre fruto de uma escolha prática a respeito de hipóteses interpretativas alternativas.", "B) O problema do garantismo penal é elaborar técnicas no plano teórico, torná-las vinculantes no plano normativo e assegurar sua efetividade no plano prático.", "C) Na aplicação da lei penal, o julgador, preocupado com a legitimação da atividade jurisdicional e com a adesão social a seus atos, deve orientar suas decisões em conformidade com o consenso geral da população.", "D) O direito penal é necessário como técnica institucional de minimização da reação violenta ao desvio socialmente não tolerado e como garantia do acusado contra os arbítrios, os excessos e os erros conexos a formas não jurídicas de controle social.", "E) As garantias penais não servem tanto para legitimar ou validar, senão mais para deslegitimar o abuso da potestade punitiva."]}, {"id": "Q0101", "texto": "De acordo com a Lei Maria da Penha, a ação de divórcio ou dissolução de união estável de mulher vítima de violência doméstica e familiar", "comando": "Complete a frase ou responda sobre a ação de divórcio ou dissolução de união estável segundo a Lei Maria da Penha.", "alternativas": ["A) deverá ser ajuizada perante o Juizado de Violência Doméstica e Familiar, uma vez que não pode haver opção da ofendida\\npor se tratar de competência em razão da pessoa.", "B) poderá ser ajuizada perante o Juizado de Violência Doméstica e Familiar contra a Mulher, excluindo-se a pretensão relacionada à partilha de bens.", "C) poderá ser ajuizada perante a Vara de Família, somente nos casos em que não houver Juizado de Violência Doméstica e\\nFamiliar contra a Mulher instalado na Comarca de residência da mulher.", "D) poderá ser ajuizada perante o Juizado de Violência Doméstica e Familiar contra a Mulher, inclusive em relação à pretensão relacionada à partilha de bens.", "E) deverá ser ajuizada perante a Vara de Família, uma vez que o Juizado de Violência Doméstica e Familiar contra a Mulher\\nestá restrito às medidas protetivas de urgência."]}, {"id": "Q0197", "texto": "É apresentada uma situação hipotética, seguida de uma assertiva a ser julgada em relação ao inquérito policial e suas peculiaridades, às atribuições da Polícia Federal e ao sistema probatório no processo penal brasileiro. Uma quadrilha efetuou ilegalmente diversas transações bancárias na modalidade de saques e transferências eletrônicas em contas de inúmeros clientes de determinada agência do Banco do Brasil. A instituição financeira ressarciu todos os clientes lesados e arcou integralmente com os prejuízos resultantes das fraudes perpetradas pelo grupo. Nessa situação hipotética, cabe à Polícia Federal a instauração do inquérito policial, porquanto a ela compete, com exclusividade, a apuração de crimes praticados contra bens e serviços da União.", "comando": "Julgue a assertiva apresentada em relação ao inquérito policial, às atribuições da Polícia Federal e ao sistema probatório no processo penal brasileiro.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0321", "texto": "Assinale a alternativa CORRETA:", "comando": "", "alternativas": ["A) Na chamada autoria colateral, não há vínculo subjetivo entre os autores.", "B) Os únicos requisitos do concurso de pessoas são:\\npluralidade de participantes; pluralidade de condutas; relevância causal de cada conduta; e identidade\\nde infração penal.", "C) O crime de aborto com o consentimento da gestante\\nnão configura exceção à teoria monista unitária do\\nconcurso de pessoas.", "D) O delito de associação para o tráfico de drogas possui natureza hedionda."]}, {"id": "Q0159", "texto": "Caio, desejando matar Túlio, dispara projéteis de arma de fogo contra seu desafeto. Túlio, alvejado, cai e permanece inerte no chão enquanto Caio retira-se do local. Observando a cena, Lívio aproxima-se com intenção de despojar a vítima de seus bens e, ao retirar o relógio, nota que Túlio esboça reação quando, então, Lívio utiliza uma pedra para acertar-lhe a cabeça. Túlio vem a óbito e no exame cadavérico o legista atesta que a morte ocorreu por concussão cerebral.", "comando": "No caso, responderão Caio e Lívio, respectivamente, por:", "alternativas": ["A) homicídio consumado e roubo próprio.", "B) homicídio tentado e latrocínio.", "C) homicídio tentado e roubo impróprio.", "D) homicídio consumado e latrocínio."]}, {"id": "Q0106", "texto": "Que delito praticam os estudantes de Direito com o chamado “pendura”, nas comemorações da instalação dos cursos jurídicos no País?", "comando": "Responda qual é o delito praticado pelos estudantes de Direito com o chamado “pendura” nas comemorações da instalação dos cursos jurídicos no País.", "alternativas": ["A) Nenhum crime foi praticado, por se tratar de fato atípico.", "B) Crime de dano qualificado, por motivo egoístico.", "C) Delito de fraude, consistente em tomar refeições em restaurante, sem dispor de recursos para pagar as despesas.", "D) Estelionato privilegiado, devido ao pequeno valor do prejuízo causado à vítima."]}, {"id": "Q0027", "texto": "O processo penal seguirá sem a presença do acusado que citado ou intimado:", "comando": "", "alternativas": ["A) pessoalmente para qualquer ato, deixar de comparecer com motivo justificado;", "B) por publicação para qualquer ato, deixar de comparecer sem motivo justificado;", "C) pessoalmente para qualquer ato, deixar de comparecer sem motivo justificado;", "D) por publicação para qualquer ato, deixar de dar andamento ao processo;", "E) pessoalmente para o ato inicial, deixar de comparecer sem motivo justificado."]}, {"id": "Q0231", "texto": "Aquele que pratica conduta descrita no tipo penal do delito de tráfico de drogas, mas em erro sobre elemento constitutivo do tipo, ou seja, em hipótese de erro de tipo essencial poderá", "comando": "", "alternativas": ["A) alegar atipicidade da conduta.", "B) responder pela modalidade culposa do delito.", "C) ser isento de pena.", "D) ter a pena diminuída com base em causa especial de diminuição de pena.", "E) alegar excludente de ilicitude da conduta."]}, {"id": "Q0256", "texto": "Tanto a conduta do agente que age imprudentemente, por desconhecimento invencível de algum elemento do tipo quanto a conduta do agente que age acreditando estar autorizado a fazê-lo ensejam como consequência a exclusão do dolo e, por conseguinte, a do próprio crime.", "comando": "Explique a consequência da conduta do agente que age imprudentemente por desconhecimento invencível ou acreditando estar autorizado a agir.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0095", "texto": "Júpiter está arrumando a ligação elétrica de sua casa, com ajuda de Jano, seu amigo, que lhe segura a escada. Deixando de observar um dever objetivo de cuidado, Júpiter faz uma ligação equivocada e recebe uma alta descarga de energia, sofrendo inutilização permanente de membro. No mesmo incidente, Jano sofre uma lesão corporal leve. Em outro cenário, Saturno, pai dedicado e amoroso, está dando banho em seu filho, Nemestrino. Imprudentemente, Saturno deixa Nemestrino cair no chão, o que causa a morte imediata do bebê.", "comando": "No que concerne à lesão corporal sofrida por Jano e ao homicídio praticado por Saturno, o perdão judicial, ao menos em tese:", "alternativas": ["A) aplica-se ao primeiro caso e depende de concordância da mãe de Nemestrino para aplicação ao segundo.", "B) aplica-se ao segundo caso, mas não ao primeiro.", "C) não se aplica a nenhum dos casos.", "D) aplica-se a ambos os casos.", "E) aplica-se ao primeiro caso, mas não ao segundo."]}, {"id": "Q0295", "texto": "Quanto à fluência dos prazos no processo penal, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": ["A) Para a defensoria pública, os prazos contam-se da data do\\nrecebimento dos autos, com vista naquele órgão, e não da\\naposição no processo do ciente de seu membro.", "B) O prazo para a interposição de apelação pelo assistente de\\nacusação, habilitado ou não, será de quinze dias a contar do\\ntérmino do prazo do MP.", "C) Tanto para o MP quanto para a defensoria pública, os prazos\\ncontam-se em dobro.", "D) Notadamente nos prazos de comunicação, a regra é a fluência\\ndo prazo a partir da juntada do mandado.", "E) Para efeitos de contagem de prazo, considera-se intimado\\no representante do MP por meio de publicação na imprensa\\noficial ou por via de mandado judicial."]}, {"id": "Q0086", "texto": "Um Auditor-Fiscal do Trabalho deixou de autuar uma empresa que havia cometido infração às normas de segurança no trabalho porque o dirigente dessa empresa prometeu-lhe uma semana de estadia num hotel de luxo, com direito a acompanhante e todas as despesas inclusas. Ocorre que, após o encerramento dos trabalhos de fiscalização e lavratura do termo de regularidade da empresa, o dirigente da mesma negou-se a cumprir a promessa.", "comando": "Nessa hipótese, o Auditor:", "alternativas": ["A) cometeu o crime de enriquecimento ilícito.", "B) cometeu o crime de corrupção passiva.", "C) cometeu o crime de concussão.", "D) cometeu o crime de facilitação de descaminho.", "E) não cometeu nenhum desses crimes porque não chegou a receber a vantagem prometida."]}, {"id": "Q0235", "texto": "Caberá recurso, no sentido estrito, da decisão que concluir pela competência do juízo. Neste caso, o recurso, que poderá ser interposto no prazo de 5 (cinco) dias, não terá efeito suspensivo.", "comando": "Neste caso, o recurso, que poderá ser interposto no prazo de 5 (cinco) dias, não terá efeito suspensivo.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0043", "texto": "Sobre a fixação da pena, tem-se o seguinte:", "comando": "Complete o estudo sobre a fixação da pena.", "alternativas": ["A) a existência de circunstância atenuante pode conduzir à redução da pena abaixo do mínimo legal.", "B) pelo critério trifásico, adotado pelo Código Penal, o juiz, na segunda fase, deverá apreciar as causas de aumento e de diminuição da parte geral e especial.", "C) o estabelecimento do valor de dias-multa independe da condição econômica do condenado.", "D) em caso de reincidência, fixada a pena em patamar inferior a 4 (quatro) anos, o condenado poderá iniciar o cumprimento da pena em regime semiaberto, desde que as circunstâncias judiciais o recomendem."]}, {"id": "Q0042", "texto": "Sobre o elemento subjetivo da conduta, dolo direto é aquele em que:", "comando": "", "alternativas": ["A) o agente prevê o resultado como possível o provável e assume o risco de produzi-lo, agindo com indiferença em relação às consequências de sua conduta.", "B) o agente tem a intenção de realizar a conduta e alcançar o resultado almejado, visualizando a produção do evento como um objetivo.", "C) o agente, em virtude de sua falta de cuidado e sem prever o resultado que seria previsível, age, provocando, desta forma, um evento indesejado.", "D) o agente, mesmo prevendo o resultado como possível ou provável, age acreditando que esse evento ocorrerá, ainda que sua conduta seja idônea para produzi-lo."]}, {"id": "Q0293", "texto": "Lucas e Serafim, primários, foram acusados, em conjunto, de praticarem um furto mediante fraude ocorrido em setembro de 2015. Recebida a denúncia em 2016, a sentença foi prolatada em 2018, absolvendo Lucas e condenando Serafim. Interposto recurso por Serafim e pelo Ministério Público, o tribunal deu provimento à apelação do Ministério Público para condenar Lucas, igualmente, conforme acórdão publicado em 2021, tendo havido certidão de trânsito em julgado no mesmo ano. Ambos restaram condenados a uma pena de 2 anos de reclusão, substituída por restritiva de direitos de prestação de serviços à comunidade e prestação pecuniária, além de multa cumulativa. Lucas iniciou o cumprimento da pena restritiva e, após cumprido pouco mais da metade das penas, interrompeu o cumprimento em 2022, sendo apurado saldo para conversão em 11 meses de reclusão. Serafim participou da audiência em 2023, tendo sido encaminhado à instituição para o cumprimento das penas; porém, não se apresentou ao local onde deveria prestar os serviços à comunidade e não pagou a prestação pecuniária ou a multa. Sobre os fatos, é correto afirmar que:", "comando": "", "alternativas": ["A) a pena de multa cumulativamente aplicada aos condenados encontra-se prescrita;", "B) a pena de Lucas foi atingida pela prescrição da pretensão executória em 2025;", "C) a pena de Serafim foi atingida pela prescrição da pretensão executória em 2025;", "D) ambos se beneficiam da prescrição da pretensão punitiva pela pena concretamente aplicada;", "E) nenhum dos dois condenados se beneficia de qualquer prescrição."]}, {"id": "Q0026", "texto": "Está fora do âmbito de proteção da Lei n.º 11.340/2006, que trata da violência doméstica contra a mulher,", "comando": "Assinale o que está fora do âmbito de proteção da Lei n.º 11.340/2006.", "alternativas": ["A) a filha transexual que é ameaçada pelo pai dentro da própria\\nresidência.", "B) a mãe vulnerável que é ameaçada e agredida pela própria\\nfilha com a qual convive.", "C) a mulher agredida dentro do ambiente laboral por colega de\\ntrabalho do sexo masculino com quem nunca teve relação\\níntima ou de afeto.", "D) a empregada doméstica agredida pelo neto da empregadora\\ndentro da casa desta.", "E) a mulher vítima de contravenção penal em razão do gênero."]}, {"id": "Q0049", "texto": "Mévia e Tício foram namorados, por 5 anos. Mévia terminou a relação, por ter conhecido e se apaixonado por outra pessoa. Tício não se conformava com o término e, diagnosticado com depressão, todos os dias, durante meses, mandava mensagem para Mévia, dizendo que a vida sem ela perdera a graça. Mévia, sabendo da condição de saúde mental de Tício, manteve-se silente durante todo o tempo. Mas, um dia, irritada com as mensagens, que estavam causando instabilidade em seu atual relacionamento, Mévia envia a Tício a seguinte resposta: “se a vida perdeu a graça, de que vale viver? Seja homem ao menos uma vez! Coloque fim em seu sofrimento e pare de me infernizar! Eu até vou a seu enterro e faço uma homenagem póstuma!” Tício visualizou a mensagem, respondendo com “Ok”. Passados dois dias, Tício se joga da janela do prédio de sua casa. Por sorte, Tício cai em cima da carroceria de um caminhão, lotado de colchão, que passava na rua no exato momento da queda. Tício não sofreu qualquer lesão. Diante da situação hipotética, assinale a alternativa correta.", "comando": "", "alternativas": ["A) Mévia não incorreu em qualquer crime, visto que o tipo penal de induzimento, instigação ou auxílio a suicídio e automutilação, para se configurar, exige que da conduta de instigar, induzir ou auxiliar advenha, no mínimo, lesão de natureza grave.", "B) Mévia, em tese, incorreu no crime de induzimento, instigação ou auxílio a suicídio e automutilação, que se configura com a conduta de induzir, instigar ou auxiliar, independentemente do resultado.", "C) Mévia, em tese, incorreu no crime de induzimento, instigação ou auxílio a suicídio e automutilação, na modalidade tentada, vez que a morte não se concretizou, por circunstância alheia a sua vontade.", "D) Mévia não incorreu em qualquer crime, visto que o tipo penal de induzimento, instigação ou auxílio a suicídio e automutilação, para se configurar, exige que da conduta de instigar, induzir ou auxiliar advenha, no mínimo, lesão de natureza leve.", "E) Mévia, em tese, incorreu no crime de induzimento, instigação ou auxílio a suicídio e automutilação, na figura qualificada, dada a relação afetiva, entre a vítima e o autor."]}, {"id": "Q0088", "texto": "Enquanto a criminologia pode ser identificada como a ciência que se dedica ao estudo do crime, do criminoso e dos fatores da criminalidade, a vitimologia tem por objeto o estudo da vítima e de suas peculiaridades, sendo considerada por alguns autores como ciência autônoma.", "comando": "Explique a diferença entre criminologia e vitimologia.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0090", "texto": "Assinale a alternativa CORRETA.", "comando": "", "alternativas": ["A) Em havendo reunião de processos perante o juízo comum ou o tribunal do júri, decorrentes da aplicação das regras de conexão e continência, não serão observados os institutos da transação penal e da composição dos danos civis, em relação aos crimes de menor potencial ofensivo.", "B) Em razão de a Lei n° 9.099/95 admitir a aplicação subsidiária das disposições do Código de Processo Penal, o juiz determinará a suspensão do processo e do curso do prazo prescricional sempre que, nos crimes submetidos ao procedimento traçado por aquela lei, o acusado, citado por edital, não comparecer e nem constituir advogado.", "C) No direito processual penal brasileiro, a réplica à resposta à acusação não se constitui em uma regra prevista expressamente para todas as modalidades de procedimentos existentes, podendo ser encontrada no procedimento aplicável aos processos de competência do Tribunal do Júri e no procedimento para os processos perante o Superior Tribunal de Justiça e o Supremo Tribunal Federal.", "D) De acordo com o Código de Processo Penal, nos processos submetidos ao rito comum ordinário, a denúncia ou queixa serão rejeitadas quando forem manifestamente ineptas, quando faltar pressuposto processual ou condição da ação para o exercício da ação penal, quando faltar justa causa para o oferecimento da ação penal e quando o fato narrado evidentemente não constitui crime.", "E) Tendo o funcionário público cometido o crime de racismo no exercício de sua função, e estando a denúncia ou queixa em devida ordem, o juiz mandará autuá-la e ordenará a notificação do acusado, para responder por escrito, dentro do prazo de quinze dias."]}, {"id": "Q0356", "texto": "O concurso de crimes é o instituto que se verifica quando o agente, mediante uma ou várias condutas, pratica duas ou mais infrações penais. Com base nesse assunto, informe se é verdadeiro (V) ou falso (F) o que se afirma a seguir e assinale a alternativa com a sequência correta. ( ) O concurso material, também chamado de real, é aquele em que o agente, mediante uma única conduta, pratica dois ou mais crimes, idênticos ou não. ( ) No concurso material, há pluralidade de condutas e pluralidade de resultados. ( ) No que diz respeito ao concurso formal impróprio ou imperfeito, tal como no concurso material, serão somadas as penas de todos os crimes praticados pelo agente. ( ) De acordo com o Código Penal brasileiro, no concurso de crimes, as penas de multa são aplicadas distinta e integralmente para cada crime.", "comando": "", "alternativas": ["A) V – F – V – F.", "B) F – V – F – V.", "C) V – V – F – V.", "D) F – V – V – V", "E) F – F – V – F."]}, {"id": "Q0253", "texto": "No que concerne às Escolas Penais, é correto afirmar que a", "comando": "Complete a frase com a afirmação correta sobre as Escolas Penais.", "alternativas": ["A) “Positiva” entende que o crime deriva de circunstâncias\\nbiológicas ou sociais, tendo sido defendida por\\nFeuerbach.", "B) “Clássica” funda-se no livre-arbítrio e tem em Carrara\\num de seus maiores expoentes.", "C) “Lombrosiana” acredita que o homem é racional e\\nnasce livre, sendo o crime fruto de uma escolha\\nerrada, concepção hipotetizada por Lombroso e\\ntambém por Ferri.", "D) “Clássica” entende que a pena é medida profilática,\\nde cura, pensamento difundido por Carmignani.", "E) “Positiva” nasce em contraposição às ideias de\\nLombroso, defende o naturalismo-racional e tem em\\nGarofalo um de seus doutrinadores."]}, {"id": "Q0038", "texto": "No que diz respeito ao ofendido e às suas prerrogativas no processo penal brasileiro, é correto afirmar que poderá:", "comando": "Complete a afirmação sobre as prerrogativas do ofendido no processo penal brasileiro.", "alternativas": ["A) interpor recurso de apelação, ainda que não habilitado como\\nassistente, quando o Ministério Público tiver recorrido de\\ntodo o conteúdo impugnável da sentença; \\n", "B) o juiz determinar o segredo de justiça em relação a dados e\\ndepoimentos constantes dos autos a respeito do ofendido\\npara evitar sua exposição aos meios de comunicação; \\n", "C) se habilitar como assistente de acusação, no curso da\\ninvestigação criminal, com a anuência prévia do Ministério\\nPúblico;", "D) requerer ao juiz a prisão temporária do investigado caso este\\nameace a sua integridade física durante a investigação\\ncriminal;", "E) requisitar a instauração de inquérito policial e a realização de\\ndiligências investigatórias que deverão ser realizadas pela\\nautoridade policial."]}, {"id": "Q0237", "texto": "Qual a diferença entre desistência voluntária e arrependimento eficaz?", "comando": "Responda qual é a diferença entre desistência voluntária e arrependimento eficaz.", "alternativas": ["A) Na desistência voluntária o que ocorre é a desistência no prosseguimento dos atos executórios do crime, feita de modo voluntário, respondendo o agente somente pelo que praticou. No arrependimento eficaz a desistência ocorre entre o término dos atos executórios e a consumação. O agente, neste caso, já fez tudo o que podia para atingir o resultado, mas resolve interferir para evitar a sua concretização.", "B) Entre a desistência voluntária e o arrependimento eficaz, em verdade, não há nenhuma diferença, porquanto em ambas as situações o que se busca é impedir o resultado.", "C) A diferença entre a desistência voluntária e o arrependimento eficaz está em que, na primeira, o agente é impedido de consumar o delito, já no arrependimento eficaz a consumação não ocorre porque o próprio agente a impede.", "D) A diferença entre a desistência voluntária e o arrependimento eficaz reside no fato de que, na desistência voluntária, o agente não chega a iniciar a execução do delito. Já no arrependimento eficaz a execução iniciada é interrompida, impedindo-se a consumação do delito.", "E) A diferença entre a desistência voluntária e o arrependimento eficaz está em que, na primeira, a execução do delito é interrompida por circunstâncias alheias ao domínio do agente. Já no arrependimento eficaz o delito não se consuma em razão da impropriedade dos meios de execução."]}, {"id": "Q0287", "texto": "Segundo o Código Penal, é excludente de ilicitude", "comando": "Complete a frase com exemplos de excludentes de ilicitude segundo o Código Penal.", "alternativas": ["A) erro de proibição", "B) estado de necessidade", "C) doença mental", "D) embriaguez acidental", "E) menoridade penal"]}, {"id": "Q0220", "texto": "De acordo com precedente firmado pelo STF em sede de controle concentrado de constitucionalidade, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": ["A) Em caso de discordância do arquivamento do inquérito\\npolicial, somente a vítima ou seu representante legal pode\\nsubmeter, a qualquer tempo, a matéria à revisão da instância\\ncompetente do órgão ministerial.", "B) Em caso de discordância do arquivamento do inquérito\\npolicial, somente a vítima ou seu representante legal pode\\nsubmeter a matéria à revisão da instância competente do\\nórgão ministerial, no prazo de trinta dias, contados do\\nrecebimento da comunicação.", "C) Em caso de discordância do arquivamento do inquérito\\npolicial, além da vítima e de seu representante legal, a\\nautoridade judicial competente também poderá submeter a\\nmatéria à revisão da instância competente do órgão\\nministerial, caso verifique patente ilegalidade ou teratologia\\nno ato do arquivamento.", "D) O STF julgou inconstitucional o dispositivo que autorizava,\\nem caso de discordância do arquivamento do inquérito\\npolicial, a submissão da matéria à revisão da instância\\ncompetente do órgão ministerial, por entender que a decisão\\nde arquivamento do inquérito policial é insuscetível de\\nrevisão.", "E) Em caso de discordância do arquivamento do inquérito\\npolicial, somente podem submeter a matéria à revisão da\\ninstância competente do órgão ministerial a vítima ou seu\\nrepresentante legal e o membro do órgão ministerial que\\nhouver se manifestado contra o arquivamento do inquérito\\npolicial."]}, {"id": "Q0109", "texto": "Aquele que oferece droga, eventualmente e sem objetivo de lucro, a pessoa de seu relacionamento, para juntos a consumirem, está sujeito à pena de", "comando": "Complete a frase com a pena aplicável.", "alternativas": ["A) medida educativa de comparecimento a programa e curso educativo e prestação de serviços à comunidade, apenas.", "B) advertência sobre os efeitos das drogas e prestação de serviços à comunidade, apenas.", "C) reclusão, de 5 (cinco) a 15 (quinze) anos, e pagamento de 500 (quinhentos) a 1.500 (mil e quinhentos) diasmulta.", "D) detenção, de 6 (seis) meses a 1 (um) ano, e pagamento de 700 (setecentos) a 1.500 (mil e quinhentos) dias-multa, sem prejuízo das sanções previstas no artigo 28 da Lei n.º 11.343/06."]}, {"id": "Q0258", "texto": "O exame de corpo de delito", "comando": "Explique o que é o exame de corpo de delito.", "alternativas": ["A) deve ser realizado por perito oficial ou pelo próprio juiz.", "B) deve ser realizado quando se mostrar ausente vestígio do crime, assegurado o direito de apresentação de quesitos pelas partes.", "C) será feito de maneira indireta no caso de competência do Tribunal do Júri.", "D) poderá ser substituído pela acareação ou pelo reconhecimento em crimes contra a fé pública.", "E) será realizado com prioridade em caso de violência doméstica e familiar contra a mulher."]}, {"id": "Q0001", "texto": "No que se refere ao Tribunal do Júri, analise as assertivas abaixo. I - O desaforamento é admitido por interesse da ordem pública, em razão de dúvida sobre a imparcialidade do júri, em razão de dúvida sobre a segurança pessoal do réu e não realização de julgamento, no período de um ano a contar da preclusão da pronúncia, em virtude de comprovado excesso de serviço. II - A natureza jurídica da impronúncia é de uma decisão terminativa e está sujeita a Recurso em Sentido Estrito. III - A absolvição sumária produz coisa julgada material. IV - A decisão de desclassificação tem natureza não terminativa.", "comando": "Estão corretas as assertivas", "alternativas": ["A) I, II e IV, apenas.", "B) II e IV, apenas.", "C) III e IV, apenas.", "D) I e III, apenas.", "E) I, II, III e IV."]}, {"id": "Q0243", "texto": "Antônio, durante a madrugada, subtrai, com o emprego de chave falsa, o automóvel de Pedro. Depois de oferecida a denúncia pela prática de crime de furto qualificado, mas antes do seu recebimento, por ato voluntário de Antônio, o automóvel furtado é devolvido à vítima. Nesse caso, pode-se afirmar a ocorrência de", "comando": "Assinale a alternativa correta.", "alternativas": ["A) arrependimento posterior.", "B) desistência voluntária.", "C) arrependimento eficaz.", "D) circunstância atenuante.", "E) causa de extinção da punibilidade."]}, {"id": "Q0294", "texto": "A respeito da culpabilidade, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": ["A) Para haver exclusão ou diminuição da cu
