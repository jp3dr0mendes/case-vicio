lpabilidade, a perda ou redução da capacidade de entendimento do caráter ilícito do fato causada pelo uso de entorpecente não deve decorrer necessariamente de caso fortuito ou força maior, visto que a dependência química, por si só, afasta ou reduz a responsabilização penal.", "B) Segundo a jurisprudência do STJ, no delito de omissão de recolhimento de contribuição previdenciária, a impossibilidade de repasse das contribuições previdenciárias em decorrência de crise financeira da empresa não constitui, nem sequer em tese, causa supralegal de exclusão da culpabilidade (inexigibilidade de conduta diversa)", "C) Conforme a teoria normativa pura, a culpabilidade não se exaure na relação de desconformidade substancial entre ação e ordenamento jurídico, mas fundamenta a reprovação pessoal contra o autor, no sentido de este não ter omitido a ação antijurídica quando ainda podia.", "D) De acordo com a teoria limitada da culpabilidade, não se faz distinção entre erro de tipo (o que recai sobre a situação de fato) e erro de proibição (o que recai sobre os limites autorizadores da norma), sendo todas essas situações consideradas erro de proibição.", "E) Nas correntes preventivas da culpabilidade, a teoria da motivação normativa tem como característica básica fundar a culpabilidade na liberdade de autodeterminação, excluída a capacidade de motivação normativa do sujeito."]}, {"id": "Q0248", "texto": "Considere os seguintes tipos penais praticados contra a Administração Pública: Tipos penais 1. Desobediência 2. Resistência 3. Corrupção passiva 4. Corrupção ativa 5. Concussão Ação a. Solicitar ou receber, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida, ou aceitar promessa de tal vantagem. b. Exigir, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida. c. Opor-se à execução de ato legal, mediante violência ou ameaça a funcionário competente para executá-lo ou a quem lhe esteja prestando auxílio. d. Desobedecer a ordem legal de funcionário público. e. Oferecer ou prometer vantagem indevida a funcionário público, para determiná-lo a praticar, omitir ou retardar ato de ofício. A correta correlação entre o tipo penal e a sua ação é:", "comando": "", "alternativas": ["A) 1-d - 2-a - 3-b - 4-e - 5-c.", "B) 1-a - 2-c - 3-d - 4-e - 5-b.", "C) 1-d - 2-c - 3-a - 4-e - 5-b.", "D) 1-d - 2-b - 3-a - 4-e - 5-c.", "E) 1e - 2-c - 3-a - 4-d - 5-b."]}, {"id": "Q0337", "texto": "A Lei nº 13.869/2019 dispõe sobre os crimes de abuso de autoridade. Sobre o assunto, analise as afirmativas abaixo e dê valores Verdadeiro (V) ou Falso (F). ( ) As condutas descritas na Lei nº 13.869/2019 constituem crime de abuso de autoridade quando praticadas pelo agente com a finalidade específica de prejudicar outrem ou beneficiar a si mesmo ou a terceiro, ou, ainda, por mero capricho ou satisfação pessoal. ( ) A divergência na interpretação de lei ou na avaliação de fatos e provas não configura abuso de autoridade. ( ) Os crimes previstos na Lei nº 13.869/2019 podem ser de ação penal pública incondicionada ou ação penal pública condicionada à representação, a depender do tipo penal.", "comando": "Assinale a alternativa que apresenta a sequência correta de cima para baixo.", "alternativas": ["A) V - V - V", "B) V - F - V", "C) F - F - V", "D) V - V - F"]}, {"id": "Q0045", "texto": "No crime de excesso de exação, o crime é qualificado se", "comando": "", "alternativas": ["A) praticado por funcionário público.", "B) cometido por meio vexatório ou gravoso, que a lei não autoriza.", "C) resulta dano para a Administração Pública ou para o administrado.", "D) o funcionário pratica ato de ofício, com infração de dever funcional, cedendo a pedido ou influência de outrem.", "E) o funcionário desvia, em proveito próprio ou de outrem, o que recebeu indevidamente para recolher aos cofres públicos."]}, {"id": "Q0245", "texto": "Assinale a opção correta a respeito da prescrição.", "comando": "", "alternativas": ["A) O empresário que, com a finalidade de obter vantagem indevida, praticar ato fraudulento do qual resulte prejuízo aos credores terá sua conduta tipificada como crime na Lei de Falências. Nesse caso, a prescrição do crime começará a correr do dia da homologação do plano de recuperação extrajudicial.", "B) A decretação da falência do devedor suspende a prescrição cuja contagem tenha-se iniciado com a concessão da recuperação judicial.", "C) As penas aplicáveis aos usuários de substâncias entorpecentes prescrevem em quatro anos, contados do início da execução da sanção penal.", "D) Depois de transitada em julgado a sentença penal condenatória, reinicia-se a contagem do prazo prescricional, que continua correndo durante o tempo em que o condenado estiver preso por outro motivo.", "E) Na hipótese de um condenado fugir faltando seis meses para o cumprimento da pena, a contagem da prescrição da pretensão executória recomeçará a partir da data da fuga. Nesse caso, a prescrição ocorrerá no lapso temporal correspondente à pena integralmente aplicada."]}, {"id": "Q0277", "texto": "NÃO configura crime contra idoso:", "comando": "", "alternativas": ["A) Induzir pessoa idosa, mesmo que com discernimento, a outorgar procuração para fins de administração de bens.", "B) Desdenhar ou menosprezar pessoa idosa.", "C) Deixar de prestar assistência ao idoso em situação de iminente perigo.", "D) Abandonar idoso em hospital.", "E) Reter cartão magnético de conta bancária relativa a benefícios."]}, {"id": "Q0292", "texto": "Considerando a atual conjuntura da política criminal brasileira, é correto afirmar que", "comando": "", "alternativas": ["A) a eficiência do trabalho policial pode ser verificado pelo baixo índice de letalidade e o alto índice de prisões efetuadas.", "B) o processo de encarceramento em massa no Brasil alavancou-se no período de vigência da Constituição Federal de 1988,\\napesar desta ter como seus fundamentos a cidadania e a dignidade da pessoa humana.", "C) a construção de presídios tem sido uma política eficaz de redução do encarceramento em massa.", "D) o crescimento da população prisional é isonômico no aspecto de gênero.", "E) a proteção de direitos humanos tem sido o principal resultado da política criminal brasileira, uma vez que o aumento da\\npopulação prisional demonstra que os bens jurídicos estão sendo cada vez mais protegidos por meio do direito penal."]}, {"id": "Q0203", "texto": "Julgue o item a seguir com base na Lei n.º 9.613/1998, que dispõe sobre lavagem de dinheiro. Havendo indícios suficientes de infração penal, é admissível a indisponibilidade de bens, direitos e valores registrados em nome de interpostas pessoas, físicas ou jurídicas, cuja existência indicar que o acusado por crime de lavagem de dinheiro é o seu verdadeiro titular.", "comando": "", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0272", "texto": "No que concerne à prática de falta grave no curso da execução penal, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": ["A) Nos termos da orientação do STJ, no caso de fuga, o marco\\ninicial da prescrição para a apuração da falta grave é o dia da\\nrecaptura, por se tratar de infração permanente.", "B) Nos termos da Lei de Execução Penal, as faltas disciplinares\\ngraves não se aplicam ao preso provisório.", "C) Conforme orientação do STJ, é exemplificativo o rol de faltas\\ngraves previsto no art. 50 da Lei de Execução Penal.", "D) Segundo o STJ, a posse de droga para uso próprio não\\nconstitui falta grave.", "E) Segundo o STJ, a utilização de tornozeleira eletrônica sem\\nbateria não configura falta grave."]}, {"id": "Q0222", "texto": "Assinale a alternativa correta.", "comando": "", "alternativas": ["A) O denominado direito penal do inimigo, que tem como expoente Günther Jakobs,\\npode ser entendido como um direito penal de segunda velocidade, restringindo\\ngarantias penais e processuais.", "B) A terceira velocidade do direito penal, ligada à ideia de aplicação de penas\\nalternativas, encontra amparo no ordenamento penal brasileiro na Lei n.\\n9.099/1995.", "C) A quarta velocidade do direito penal refere-se ao neopunitivismo, abrangendo\\naquelas pessoas que violaram tratados e convenções internacionais de direitos\\nhumanos, ostentando a condição de Chefes de Estado, devendo sofrer a incidência\\nde normas internacionais.", "D) A teoria da primeira velocidade do direito penal, fundada no respeito às garantias\\nindividuais, tinha a ideia de um direito penal de mínima intervenção e sanções não\\nprivativas de liberdade.", "E) A ideia de velocidades do direito penal foi concebida e sistematizada pelo professor\\nManuel Cancio Meliá."]}, {"id": "Q0234", "texto": "A interdisciplinaridade é intrínseca à natureza da criminologia. Dessa forma, a ciência que se afasta do estudo da criminologia é a", "comando": "Complete a frase sobre a ciência que se afasta do estudo da criminologia.", "alternativas": ["A) biologia.", "B) hermenêutica dogmática.", "C) psicologia.", "D) estatística.", "E) sociologia."]}, {"id": "Q0178", "texto": "A Resolução CNJ nº 467/2022 regulamentou o inciso XI do artigo 6º da Lei nº 10.826/2003 e prevê que o porte de arma de fogo de servidores dos quadros pessoais do Poder Judiciário é:", "comando": "", "alternativas": ["A) defeso aos servidores do Poder Judiciário, enquadrados como agentes e inspetores da especialidade Polícia Judicial, ainda que efetivamente estejam no exercício do poder de polícia, em todo o território nacional, sendo permitido somente no Estado em que está lotado para o exercício de suas funções.", "B) autorizado aos servidores do Poder Judiciário, enquadrados como agentes e inspetores da especialidade Polícia Judicial, independentemente de estarem no exercício do poder de polícia, somente no Estado em que estejam lotados.", "C) defeso aos servidores do Poder Judiciário, enquadrados como agentes e inspetores da especialidade Polícia Judicial, ainda que efetivamente estejam no exercício do poder de polícia, em todo o território nacional.", "D) autorizado aos servidores do Poder Judiciário, enquadrados como agentes e inspetores da especialidade Polícia Judicial, e que efetivamente estejam no exercício do poder de polícia, em todo o território nacional.", "E) autorizado aos servidores do Poder Judiciário, enquadrados como agentes e inspetores da especialidade Polícia Judicial, e que efetivamente estejam no exercício do poder de polícia, somente no Estado em que estejam lotado para os exercícios de suas funções."]}, {"id": "Q0180", "texto": "João é investigado pela prática de um crime de peculato. Durante a fase de inquérito policial, o Delegado de Polícia, sem autorização judicial, determina a entrada de agentes na residência de João durante a noite, sob o argumento de que o crime em questão causa grave dano ao erário e que a apreensão de documentos seria essencial para evitar a ocultação de provas. Os agentes apreendem diversos computadores que continham evidências do crime. Diante de tal situação hipotética, assinale a afirmativa correta.", "comando": "", "alternativas": ["A) A prova é plenamente válida, uma vez que o princípio da busca da verdade real se sobrepõe à inviolabilidade do domicílio em crimes cometidos contra a Administração Pública.", "B) A prova é legítima se for demonstrado que a diligência foi pautada pelo princípio da eficiência, visando à celeridade processual e à proteção do patrimônio público.", "C) Pelo princípio da não culpabilidade, João não poderia ter seus bens apreendidos antes de uma sentença penal condenatória transitada em julgado.", "D) Em virtude do princípio do contraditório, o Delegado de Polícia é obrigado a intimar a defesa de João para acompanhar a diligência de busca e apreensão na residência, sob pena de nulidade absoluta.", "E) As provas obtidas são ilícitas, pois, embora a entrada em domicílio possa ocorrer sem mandado em caso de flagrante delito, a busca para apreensão de provas exige ordem judicial e deve respeitar o período diurno, salvo consentimento do morador."]}, {"id": "Q0075", "texto": "Quanto à comunicabilidade da extinção da punibilidade, é INCORRETO afirmar:", "comando": "", "alternativas": ["A) A extinção da punibilidade de crime que é circunstância agravante de outro não se estende a este.", "B) Nos crimes conexos, a extinção da punibilidade de um deles não impede, quanto aos outros, a agravação da pena resultante da conexão.", "C) A extinção da punibilidade de crime que é pressuposto de outro não se estende a este.", "D) A extinção da punibilidade de crime que é elemento constitutivo de outro não se estende a este.", "E) Nos crimes conexos, a extinção da punibilidade de um deles impede, quanto aos outros, a agravação da pena resultante da conexão."]}, {"id": "Q0015", "texto": "Com relação ao inquérito policial, segundo o Código de Processo Penal.", "comando": "Assinale a alternativa correta.", "alternativas": ["A) A polícia judiciária será exercida pelas autoridades policiais em todo o território nacional, independente de circunscrição, com o fim de apurar as infrações penais e sua autoria.", "B) Na legislação processual penal, é inaplicável a interpretação extensiva e analógica, bem como o suplemento dos princípios gerais do direito.", "C) O inquérito deverá terminar no prazo de trinta dias, se o indiciado tiver sido preso em flagrante, ou estiver preso preventivamente, contado o prazo a partir do dia da prisão.", "D) O Ministério Público não poderá requerer a devolução do inquérito à autoridade policial, senão para novas diligências, imprescindíveis ao oferecimento da denúncia.", "E) O ofendido, ou seu representante legal, poderá requerer qualquer diligência, a qual será realizada obrigatoriamente, considerados os princípios do contraditório e da ampla defesa."]}, {"id": "Q0146", "texto": "A Constituição Federal de 1988, no artigo 5°, inciso LVI, prevê expressamente a inadmissibilidade da utilização no processo de provas obtidas por meios ilícitos. De acordo com as teorias adotadas pelo legislador brasileiro e recente entendimento jurisprudencial, descarta-se a ilicitude da prova na seguinte situação.", "comando": "Assinale a alternativa correta.", "alternativas": ["A) Juca está sendo acusado de crime, porém\\nalega que é inocente e tudo não passa de um\\nplano vingativo elaborado por seu desafeto\\npolítico. No intuito de provar sua inocência, Juca contrata investigador particular, o qual\\ninstala sistema de captação de imagem e\\nsom clandestinamente no escritório do\\nseu desafeto. Por meio das imagens e som\\ngravados, Juca consegue extrair conversa que\\nprova indubitavelmente não ser ele autor do\\ncrime denunciado e faz a juntada nos autos do\\nprocesso judicial.", "B) Um grupo de policiais civis estava executando\\noperação contra o tráfico na cidade de Campo\\nGrande-MS, quando suspeitou que Arnolgildo\\nestaria filmando toda ação policial. Por esse\\nmotivo, Arnolgildo foi então abordado pelos\\npoliciais civis, os quais, sem a existência de\\nmandado judicial, efetuaram uma busca na sua\\nresidência e localizaram 9 gramas de crack e\\n0,4 gramas de cocaína. Arnolgildo foi preso em\\nflagrante pela acusação de tráfico de drogas.", "C) Autorizada interceptação telefônica em face\\nde Diná Sabino de acordo com os ditames legais, ao término, é extraída prova da prática\\nde delito por esta. No entanto, as conversas de\\ncunho probatório são aquelas que haviam sido\\nrealizadas entre Diná Sabino e seu advogado,\\nquando a primeira confessa a prática de crimes\\ne requer orientação de como proceder para\\nser inocentada.", "D) Ao cumprir mandado de busca e apreensão\\nem investigação de crime de homicídio,\\nos policiais acessam os computadores da\\nresidência do investigado e levantam diversos\\ndados que demonstram a coautoria do vizinho. Dessa forma, os policiais estendem informalmente o mandado judicial e cumprem\\na diligência, também, na residência do vizinho,\\nem observância ao princípio da celeridade\\nprocessual.", "E) Chegou ao conhecimento da autoridade\\npolicial que determinado caminhão estava\\ntransportando alta quantidade de drogas.\\nEm cumprimento de mandado judicial, foram\\nrealizadas busca e apreensão do veículo,\\nconfirmando-se o fato. No decorrer do processo\\njudicial, constatou-se que o crime havia sido\\ndescoberto no 16° dia do início de interceptação\\ntelefônica, deferida judicialmente pelo prazo\\ninicial de 30 dias. Verificou-se, ainda, que houve\\npedido de prorrogação após um dia do término\\ndo prazo inicial."]}, {"id": "Q0289", "texto": "“A Lei nº 11.340/2006 aporta em nosso ordenamento jurídico em resposta às graves violações de direitos sofridas pelas mulheres em situação de violência doméstica, às flagrantes desigualdades de gênero e à proteção ineficaz e incompleta dos instrumentos legais existentes anteriormente à edição deste diploma normativo. Neste enorme espaço de vácuo legislativo, a introdução da lei em questão significou verdadeira revolução em matéria de defesa dos direitos das mulheres, quebrando os paradigmas antes existentes, inserindo novos institutos e instaurando um modelo protetivo inteiramente inédito no ordenamento jurídico brasileiro” (STJ, REsp nº 2.070.863/MG, relator: Ministro Joel Ilan Paciornik, relator para acórdão: Ministro Rogerio Schietti Cruz, Terceira Seção, julgado em 13.11.2024, DJEN de 25.03.2025). De acordo com os aspectos processuais penais da violência doméstica e familiar contra a mulher, assinale a alternativa correta.", "comando": "", "alternativas": ["A) O STJ, por meio da Terceira Seção, fixou a tese quanto ao Tema Repetitivo nº 1.186, de que: 1. a condição de gênero feminino é insuficiente para atrair a aplicabilidade da Lei Maria da Penha em casos de violência doméstica e familiar, prevalecendo sobre a questão etária. 2. a Lei Maria da Penha prevalece quando suas disposições conflitarem com as de estatutos específicos, como o da Criança e do Adolescente.", "B) Nos casos de violência contra a mulher praticados no âmbito doméstico e familiar, é possível a fixação de valor mínimo indenizatório a título de dano moral, independentemente de pedido expresso da acusação ou da parte ofendida e de instrução probatória, segundo tese firmada quando do Tema Repetitivo nº 983, pelo STJ.", "C) Nos termos da Lei nº 11.340/2006, o nome da ofendida ficará sob sigilo nos processos em que se apuram crimes praticados no contexto de violência doméstica e familiar contra a mulher, abrangendo o sigilo do nome do autor do fato e os demais dados do processo.", "D) A concessão das medidas protetivas de urgência, de acordo com a Lei nº 11.340/2006, depende da tipificação penal da violência.", "E) O STJ definiu as seguintes teses quanto ao Tema Repetitivo nº 1.249: I – as medidas protetivas de urgência (MPUs) têm natureza jurídica de tutela inibitória e sua vigência não se subordina à existência (atual ou vindoura) de boletim de ocorrência, inquérito policial, processo cível ou criminal; II – a duração das MPU vincula-se à persistência da situação de risco à mulher, razão pela qual devem ser fixadas por prazo temporalmente indeterminado; III – eventual reconhecimento de causa de extinção de punibilidade, arquivamento do inquérito policial ou absolvição do acusado não origina, necessariamente, a extinção da medida protetiva de urgência, máxime pela possibilidade de persistência da situação de risco ensejadora da concessão da medida; IV – não se submetem a prazo obrigatório de revisão periódica, mas devem ser reavaliadas pelo magistrado, de ofício ou a pedido do interessado, quando constatado concretamente o esvaziamento da situação de risco. A revogação deve sempre ser precedida de contraditório, com as oitivas da vítima e do suposto agressor. Em caso de extinção da medida, a ofendida deve ser comunicada, nos termos do art. 21 da Lei nº 11.340/2006."]}, {"id": "Q0331", "texto": "Assinale a alternativa incorreta.", "comando": "", "alternativas": ["A) O Habeas Corpus não poderá ser interposto quando houver ameaça de violência ou coação à liberdade de locomoção, por abuso de poder ou ilegalidade.", "B) O Promotor de Justiça poderá impetrar ordem de Habeas Corpus.", "C) O Magistrado jamais poderá impetrar ordem de Habeas Corpus em favor de terceiro, mas poderá conceder de ofício a ordem no processo que preside.", "D) Não caberá intervenção do Assistente do Ministério Público no processo de Habeas Corpus.", "E) Não se pode conhecer de impetração de Habeas Corpus apócrifa."]}, {"id": "Q0328", "texto": "Acerca do conceito e das funções da criminologia, julgue o item seguinte. Na inter-relação entre o direito penal, a política criminal e a criminologia, compete a esta facilitar a recepção das investigações empíricas e a sua transformação em preceitos normativos, incumbindo-se de converter a experiência criminológica em proposições jurídicas, gerais e obrigatórias.", "comando": "Julgue o item seguinte.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0310", "texto": "Sobre a aplicação da Lei Processual Penal, é correto afirmar que:", "comando": "Assinale a alternativa correta.", "alternativas": ["A) no Brasil, adota-se integralmente o princípio da irretroatividade da lei processual penal, que impede que as inovações na norma processual penal sejam aplicadas de imediato para fatos praticados antes de sua entrada em vigor.", "B) ela admitirá interpretação extensiva e o suplemento de princípios gerais do direito, mas não a aplicação analógica.", "C) o processo penal reger-se-á, em todo o território brasileiro, pelo Código de Processo Penal, não havendo qualquer ressalva prevista neste diploma.", "D) as normas previstas no Código de Processo Penal de natureza híbrida, ou seja, com conteúdo de direito processual e de direito material, devem respeitar o princípio que veda a aplicação retroativa da lei penal, quando seu conteúdo for prejudicial ao réu.", "E) ela admitirá interpretação extensiva e aplicação analógica, mas não o suplemento dos princípios gerais do direito"]}, {"id": "Q0057", "texto": "Por iter criminis compreende-se o conjunto de", "comando": "Complete a definição de iter criminis.", "alternativas": ["A) atos de execução do delito.", "B) atos preparatórios antecedentes ao delito.", "C) atos de consumação do delito.", "D) fases pelas quais passa o delito.", "E) atos de cogitação."]}, {"id": "Q0233", "texto": "Sobre a desistência voluntária e o arrependimento eficaz, assinale a alternativa correta:", "comando": "Assinale a alternativa correta.", "alternativas": ["A) o agente que, voluntariamente, impede que o resultado do crime se produza não responde pelos seus atos, porque incide na hipótese de desistência voluntária;", "B) o agente que, voluntariamente, desiste de prosseguir na execução do crime, não responde pelos atos praticados, desde que tais atos não configurem, isoladamente, crime ou contravenção penal, sendo o caso de desistência voluntária;", "C) o agente que, voluntariamente, repare o dano ou restitua a coisa ao proprietário, até o recebimento da denúncia, não responde pelos seus atos, estando configurada a hipótese de arrependimento eficaz;", "D) considera-se arrependimento eficaz quando o agente, iniciada a execução do crime, por ineficácia absoluta do meio, não consegue consumá-lo, não respondendo pelos atos praticados;", "E) é caso de desistência voluntária quando o agente, por absoluta impropriedade do objeto, impede que o resultado se produza, só responde pelos atos já praticados."]}, {"id": "Q0112", "texto": "As penas do crime de promover, constituir, financiar ou integrar organização criminosa, do art. 2° da Lei n° 12.850/13, são aumentadas de 1/6 a 2/3, nos termos do parágrafo 4°, se", "comando": "Assinale a alternativa correta.", "alternativas": ["A) houver impedimento ou, de qualquer forma, embaraçar-se a investigação de infração penal cometida no\\nseio da organização criminosa.", "B) na atuação da organização criminosa houver emprego\\nde arma de fogo.", "C) houver concurso de funcionário público, valendo-se\\na organização criminosa dessa condição para a prática de infração penal.", "D) o acusado exercer o comando, individual ou coletivo,\\nda organização criminosa, ainda que não pratique\\npessoalmente atos de execução.", "E) das ações diretas ou indiretas da organização criminosa resultar morte."]}, {"id": "Q0139", "texto": "A frase “há sujeitos que têm uma menor possibilidade de autodeterminação, condicionados dessa maneira por causas sociais”, está ligada à:", "comando": "Assinale a alternativa correta.", "alternativas": ["A) Ideia do conceito de causa supralegal exculpante;", "B) Ideia do conceito de culpabilidade no funcionalismo teleológico;", "C) Ideia do conceito normativo puro da culpabilidade;\\n", "D) Ideia do conceito psicológico-normativo de culpabilidade;", "E) Ideia do conceito de coculpabilidade."]}, {"id": "Q0263", "texto": "O juiz dar-se-á por suspeito e, se não o fizer, poderá ser recusado por qualquer das partes: I. Se ele próprio ou seu cônjuge ou parente, consanguíneo ou afim, em linha reta ou colateral até o terceiro grau, inclusive, for parte ou diretamente interessado no feito. II. Se ele, seu cônjuge, ascendente ou descendente, estiver respondendo a processo por fato análogo, sobre cujo caráter criminoso haja controvérsia. III. Se ele, seu cônjuge, ou parente, consanguíneo, ou afim, até o terceiro grau, inclusive, sustentar demanda ou responder a processo que tenha de ser julgado por qualquer das partes. IV. Ele próprio houver desempenhado qualquer dessas funções (defensor ou advogado, órgão do Ministério Público, autoridade policial, auxiliar da justiça ou perito) ou servido como testemunha.", "comando": "Avalie as assertivas acima e marque a alternativa CORRETA.", "alternativas": ["A) Apenas as assertivas I e IV estão corretas.", "B) Apenas as assertivas I, II e III estão corretas.", "C) Apenas as assertivas II e III estão corretas.", "D) Todas as assertivas estão corretas."]}, {"id": "Q0285", "texto": "Constitui uma das características do direito penal do inimigo", "comando": "Complete a frase com a característica correta do direito penal do inimigo.", "alternativas": ["A) a legislação diferenciada.", "B) a punição a partir de atos executórios.", "C) a não utilização de medidas de segurança.", "D) a observância das garantias processuais penais.", "E) o abrandamento das penas na antecipação da tutela penal."]}, {"id": "Q0035", "texto": "Nos termos da Lei no 13.260/2016 (Lei Antiterrorismo), assinale a alternativa correta.", "comando": "", "alternativas": ["A) Os crimes previstos na referida Lei são praticados contra o interesse da União, cabendo à Polícia Federal a investigação criminal, em sede de inquérito policial.", "B) Aquele que for flagrado constituindo uma organização terrorista, não cometerá um crime, estando sujeito a responsabilização por realizar atos preparatórios do terrorismo.", "C) O terrorismo consistirá sempre na prática por mais de um indivíduo de atos criminosos por razões de xenofobia, discriminação ou preconceito de raça, cor, etnia e religião, quando cometidos com a finalidade de provocar terror social ou generalizado.", "D) São atos de terrorismo incendiar, depredar, saquear, destruir ou explodir meios de transporte ou qualquer bem público ou privado.", "E) São atos de terrorismo incendiar, interferir, sabotar ou danificar sistemas de informática ou bancos de dados, quando cometidos com a finalidade de provocar terror social ou generalizado."]}, {"id": "Q0157", "texto": "A prisão temporária decretada no curso de inquérito policial instaurado para investigar crime de epidemia com resultado morte, artigo 267, § 1º, do Código Penal, tem prazo limite de", "comando": "Complete a frase com o prazo limite correto da prisão temporária.", "alternativas": ["A) cinco dias prorrogáveis por mais cinco.", "B) dez dias prorrogáveis por mais dez.", "C) quinze dias prorrogáveis por mais quinze.", "D) vinte dias prorrogáveis por mais vinte.", "E) trinta dias prorrogáveis por mais trinta."]}, {"id": "Q0336", "texto": "Em 05 de junho de 2022, Mariana entrou em um restaurante estilo “self-service” e apoiou sua bolsa em uma cadeira. Enquanto conversava distraidamente com seu marido, José, Mariana esqueceu sua bolsa aberta. Diogo, outro cliente que estava no estabelecimento, terminou o almoço, levantou-se de onde estava sentado e foi em direção ao caixa para efetuar o pagamento da conta. Nesse momento, Diogo percebeu a bolsa de Mariana aberta e, sorrateiramente, pegou o aparelho celular dela. Logo em seguida, Mariana e José deram falta do aparelho e iniciaram a procura no local, tendo José visto Diogo na fila do caixa com o celular de Mariana. Imediatamente, José interpelou Diogo e restou comprovado que se tratava realmente do celular de Mariana. De acordo com jurisprudência consolidada dos Tribunais Superiores, em relação à conduta de Diogo, pode-se afirmar que", "comando": "", "alternativas": ["A) praticou o crime de roubo consumado, previsto no art. 157, caput, do CP.", "B) praticou o crime de furto, na sua forma tentada, previsto no art. 155, caput, c/c art. 14, II, ambos do CP.", "C) praticou o crime de roubo, na sua forma tentada, previsto no art. 157, caput c/c art. 14, II, ambos do CP.", "D) praticou o crime de furto consumado, previsto no art. 155, caput, do CP.", "E) praticou o crime de apropriação indébita, previsto no art. 168, caput, do CP."]}, {"id": "Q0033", "texto": "A prisão preventiva", "comando": "Explique o que é a prisão preventiva.", "alternativas": ["A) pode ser decretada como garantia da ordem pública, mas não da econômica.", "B) é obrigatória no caso de réu citado por edital e que não constituiu defensor, nos termos do art. 366 do Código de Processo Penal.", "C) não admite revogação por excesso de prazo para o término da instrução, medida cabível apenas para o relaxamento de flagrante.", "D) não é cabível se houver apresentação espontânea do acusado à autoridade.", "E) pode recair sobre acusado primário e de bons antecedentes."]}, {"id": "Q0309", "texto": "Segundo o Artigo 61 da Lei nº 9.605/98 a pena para quem disseminar doença ou praga ou espécies que possam causar dano à agricultura, à pecuária, à fauna, à flora ou aos ecossistemas é de:", "comando": "Complete a frase com a pena prevista no Artigo 61 da Lei nº 9.605/98.", "alternativas": ["A) reclusão, de um a cinco anos.", "B) prestação de serviços à comunidade com interdição temporária de direitos e multa.", "C) reclusão, de um a quatro anos, e multa.", "D) reclusão, de seis meses a dois anos, e multa.", "E) detenção, de três meses a um ano, e multa."]}, {"id": "Q0251", "texto": "Considere as assertivas abaixo sobre extinção da puni bilidade. I - É taxativo o rol das causas de extinção de punibilidade previsto no art. 107 do Código Penal. II - A anistia e o indulto se referem a fatos e pessoas determinados, respectivamente. III - A perda do direito de punir do Estado pelo não exercício em determinado lapso de tempo é causa de extinção da punibilidade.", "comando": "Quais são corretas?", "alternativas": ["A) Apenas I", "B) Apenas II", "C) Apenas III", "D) Apenas II e III", "E) I, II e III"]}, {"id": "Q0341", "texto": "Quanto aos crimes contra o patrimônio, possível assegurar que", "comando": "Complete a frase sobre os crimes contra o patrimônio.", "alternativas": ["A) é pública condicionada a ação penal no caso de dano cometido por motivo egoístico ou com prejuízo considerável para a vítima.", "B) é causa de aumento da pena no roubo o fato de a vítima estar em serviço de transporte de valores, independentemente de o agente conhecer a circunstância.", "C) é admissível no furto praticado em concurso de pessoas o acréscimo de um terço até metade sobre a pena prevista para a forma simples do delito, por aplicação analógica do disposto para o roubo majorado pela mesma circunstância.", "D) o crime de duplicata simulada é de natureza formal, não exigindo a ocorrência de resultado naturalístico.", "E) cabível o perdão judicial na receptação dolosa simples, se primário o agente e de pequeno valor a coisa."]}, {"id": "Q0188", "texto": "Segundo sua classificação doutrinária dominante, o chamado ofendículo pode mais precisamente caracterizar situação de exclusão de", "comando": "Complete a frase sobre a caracterização do ofendículo segundo a doutrina dominante.", "alternativas": ["A) antijuridicidade.", "B) tipicidade.", "C) periculosidade.", "D) culpabilidade.", "E) punibilidade."]}, {"id": "Q0312", "texto": "Para Liszt, o fundamento da pena é orientado às finalidades de: a) ressocialização dos delinquentes suscetíveis de socialização; b) intimidação dos que não têm necessidade de socialização; c) neutralização dos não suscetíveis de socialização.", "comando": "Explique as finalidades da pena segundo Liszt.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0165", "texto": "A Lei n° 12.850, de 2 de agosto de 2013, dentre outras disposições, definiu organização criminosa e dispôs sobre a investigação criminal, os meios de obtenção da prova, infrações penais correlatas e o procedimento criminal. A seu respeito, é correto afirmar que", "comando": "Assinale a alternativa correta.", "alternativas": ["A) tanto aquele que promove organização criminosa quanto o que, de qualquer forma,\\nembaraça a investigação de infração penal que envolva organização criminosa serão\\napenados com pena de reclusão, de 3 (três) a 8 (oito) anos, e multa, sem prejuízo das penas\\ncorrespondentes às demais infrações penais praticadas.", "B) por expressa disposição legal, não existirá organização criminosa típica voltada a obter\\nvantagem, de qualquer natureza, mediante a prática de contravenções penais.", "C) se houver participação de criança ou adolescente na organização ou na associação\\ncriminosa, a pena será aumentada de 1/6 (um sexto) a 2/3 (dois terços).", "D) quando a medida se fizer necessária à investigação ou instrução processual, se houver indícios\\nsuficientes de que o funcionário público integra organização criminosa, poderá o juiz\\ndeterminar seu afastamento cautelar do cargo, emprego ou função, sem remuneração.", "E) ao tratar da colaboração premiada, em seu artigo 4°, a lei restringe expressamente a\\nconcessão do perdão judicial à hipótese da localização de eventual vítima com a sua\\nintegridade física preservada."]}, {"id": "Q0262", "texto": "Sobre a superveniência de doença mental ao apenado na fase de execução de pena , é correto afirmar:", "comando": "Assinale a alternativa correta.", "alternativas": ["A) Sobrevinda doença mental ao réu depois da sentença condenatória, haja vista exceção expressa\\nno CPP, pode ser decretada pelo juízo da causa, ao constatar a enfermidade do apenado em oitiva,\\na sua remoção provisória para hospital de custódia e tratamento psiquiátrico, sem prejuízo de revisão\\nda decisão judicial em sede de recurso, pendente de exame.", "B) Pela Lei de Execução Penal, atestada em perícia médica o leve grau da enfermidade do apenado,\\nmesmo não tendo sido feita a conversão da pena em medida de segurança, poderá ser determinado\\npelo juízo o tratamento ambulatorial na própria unidade penitenciária, em vez de ser decretada a\\ninternação em hospital de custódia.", "C) Em qualquer circunstância, a remoção do apenado para hospital de custódia e tratamento\\npsiquiátrico poderá ser determinada provisoriamente pelo diretor do estabelecimento penal,\\ncomunicando-se imediatamente ao juiz, que em face da perícia médica, ratificará ou revogará a\\nmedida, na forma de regras do CPP não revogadas pela reforma legislativa.", "D) Suspensa a execução da pena em virtude de superveniência de doença mental do apenado,\\naplicada a medida de segurança, prevalecem as normas desta até o fim da execução, mesmo que\\nantes do término do tempo de pena ocorra a cura da enfermidade, atestada em perícia.", "E) O juiz da execução poderá, com base em perícia médica, determinar o internamento em hospital\\nde custódia e tratamento psiquiátrico ou, a conversão da pena em medida de segurança, acaso\\nsobrevinda a doença mental ao apenado durante a execução."]}, {"id": "Q0158", "texto": "Considere a seguinte situação hipotética: João, agente público, foi processado e, ao final, condenado à pena de reclusão, por dezenove anos, iniciada em regime fechado, pela prática do crime de tortura, com resultado morte, contra Raimundo. Nos termos da Lei no 9.455, de 7 de abril de 1997, essa condenação acarretará a perda do cargo, função ou emprego público", "comando": "Assinale a alternativa correta.", "alternativas": ["A) e a interdição para seu exercício pelo dobro do prazo\\nda pena aplicada.", "B) e a interdição para seu exercício pelo triplo do prazo\\nda pena aplicada.", "C) e a interdição para seu exercício pelo tempo da pena\\naplicada.", "D) desde que o juiz proceda à fundamentação específica.", "E) como efeito necessário, mas não automático."]}, {"id": "Q0108", "texto": "Durante a realização de audiência de instrução e julgamento, em que se apurava a prática, por Caio, do crime de roubo simples, a defesa técnica do acusado requereu o reconhecimento da prescrição da pretensão punitiva estatal, em observância aos prazos prescricionais estipulados em lei. Contudo, o Juízo indeferiu o pedido e, finda a instrução, determinou que as partes apresentassem memoriais. Irresignada, a Defensora Pública Maria pretende recorrer do provimento jurisdicional prolatado. Nesse cenário, considerando as disposições do Código de Processo Penal, Maria, na qualidade de Defensora Pública, deverá interpor um(a)", "comando": "Indique qual recurso Maria deverá interpor.", "alternativas": ["A) recurso em sentido estrito, fazendo jus ao efeito suspensivo\\npor força de lei.", "B) recurso inominado, fazendo jus ao efeito suspensivo por força\\nde lei.", "C) recurso em sentido estrito, sem efeito suspensivo por força de\\nlei.", "D) recurso inominado, sem efeito suspensivo por força de lei.", "E) apelação, sem efeito suspensivo por força de lei."]}, {"id": "Q0200", "texto": "No que diz respeito às organizações criminosas, assinale a opção correta.", "comando": "Assinale a opção correta.", "alternativas": ["A) O líder de organização criminosa condenado pelo crime de integrar tal organização deverá iniciar o cumprimento da pena necessariamente em estabelecimento penal de segurança máxima.", "B) A definição legal de organização criminosa promovida pela\\nLei n.º 12.850/2013 internaliza na legislação nacional a\\ndefinição de grupo criminoso organizado constante da\\nConvenção de Palermo.", "C) O concurso de funcionário público é qualificadora do crime\\nde integrar organização criminosa.", "D) Havendo indício de participação de funcionário público na\\norganização criminosa, é cabível a determinação judicial de\\nafastamento cautelar do cargo, do emprego ou da função, sem\\nremuneração, quando necessária à investigação ou instrução\\nprocessual.", "E) Para que seja possível nova acusação pelo crime de integrar\\norganização criminosa contra os mesmos agentes por novo\\ncrime de mesma espécie, sem configurar bis in idem, deve ser\\nconsiderada cessada a permanência da conduta com o\\nrecebimento da denúncia."]}, {"id": "Q0082", "texto": "João e Cléber, policiais militares do estado de Santa Catarina, receberam denúncia anônima no sentido de que Tício estaria agredindo a sua companheira. Em assim sendo, os agentes públicos compareceram ao local dos fatos e constataram, in loco, a violência perpetrada contra a mulher. Nesse contexto, durante a contenção de Tício, este se opôs à execução do ato afirmando que mataria João caso não fosse solto. Passados trinta minutos, o indivíduo foi acalmado pelos policiais e encaminhado à Delegacia de Polícia.", "comando": "Nesse cenário, considerando as disposições do Código Penal, Tício responderá pelo crime de:", "alternativas": ["A) excesso de exação, além da responsabilização pela infração\\npenal perpetrada contra a sua companheira;", "B) desobediência, além da responsabilização pela infração penal\\nperpetrada contra a sua companheira;", "C) tergiversação, além da responsabilização pela infração penal\\nperpetrada contra a sua companheira;", "D) resistência, além da responsabilização pela infração penal\\nperpetrada contra a sua companheira;", "E) concussão, além da responsabilização pela infração penal\\nperpetrada contra a sua companheira."]}, {"id": "Q0148", "texto": "Ao proferir uma sentença condenatória em uma ação penal, o juiz vislumbra que o réu confessou em juízo a autoria do delito e que constam em sua folha de antecedentes criminais duas anotações, assinalando condenações anteriores definitivas à prática do crime objeto do processo, cujas penas foram cumpridas um e quatro anos antes, respectivamente, do cometimento do crime em julgamento. Diante da situação narrada, deverá o magistrado.", "comando": "Indique a conduta correta que o magistrado deve adotar diante da situação apresentada.", "alternativas": ["A) atenuar a pena-base, na segunda fase da dosimetria da pena, fazendo prevalecer a atenuante da confissão espontânea sobre a agravante da reincidência;", "B) manter a pena-base, na segunda fase da dosimetria da pena, compensando integralmente a agravante da reincidência com a atenuante da confissão espontânea;", "C) agravar a pena-base, na segunda fase da dosimetria da pena. fazendo prevalecer a agravante da reincidência sobre a atenuante da confissão espontânea;", "D) agravar a pena-base, na segunda fase da dosimetria da pena. fazendo prevalecer a agravante da reincidência e compensando a atenuante da confissão espontânea com uma das anotações criminais geradora de reincidência;", "E) fixar a pena-base acima do mínimo legal cominado ao crime, reconhecendo os maus antecedentes, e, na fase seguinte da dosimetria, manter a pena, compensando integralmente a agravante da reincidência com a atenuante da confissão espontânea."]}, {"id": "Q0318", "texto": "Com intenção de matar Mário, Lúcio adquiriu, de forma clandestina, uma arma de fogo e munições. Após monitorar a rotina da vítima, Lúcio aguardou Mário sair do trabalho e, enquanto ele caminhava em direção ao seu veículo, Lúcio sacou a arma e disparou uma única vez, atingindo-o. Mesmo possuindo ainda quatro projéteis intactos na arma, Lúcio sentiu repentino remorso, guardou a arma e ligou para o serviço de emergência. Mário foi socorrido, mas, apesar de todo o esforço médico empregado, veio a falecer dias depois no hospital em decorrência exclusiva dos ferimentos causados pelos disparos. Diante de tal situação hipotética, assinale a afirmativa correta.", "comando": "", "alternativas": ["A) O caso narrado configura desistência voluntária, uma vez que Lúcio interrompeu voluntariamente a execução do homicídio quando ainda dispunha de meios para prosseguir, devendo, portanto, responder apenas pelo delito de lesão corporal.", "B) O caso narrado configura arrependimento eficaz, pois Lúcio exauriu os meios de execução que seriam suficientes para atingir o resultado almejado, contudo, agiu positivamente para evitá-lo, devendo, portanto, responder apenas pela tentativa de homicídio.", "C) A intervenção de Lúcio ao chamar o socorro não exclui a tipicidade, uma vez que o resultado morte efetivamente ocorreu por consequência direta de sua conduta, devendo ele responder por homicídio consumado, sem prejuízo da aplicação de atenuante genérica.", "D) O caso narrado configura arrependimento posterior, pois Lúcio buscou minimizar as consequências do crime praticado logo após a sua consumação ao chamar o socorro médico, o que enseja a redução da pena do homicídio de um a dois terços.", "E) O caso narrado configura crime impossível por ineficácia relativa do meio empregado, pois a intervenção médica quase evitou o resultado, demonstrando que a conduta do agente não era inequivocamente apta a garantir a consumação inicialmente pretendida."]}, {"id": "Q0030", "texto": "Aquele que, mediante violência ou grave ameaça constrange alguém a trabalhar ou não trabalhar durante certo periodo:", "comando": "Complete a definição ou responda conforme o enunciado.", "alternativas": ["A) Não comete crime, por falta de capitulação legal;", "B) Comete crime de constrangimento ilegal;", "C) Comete crime de atentado contra a liberdade de trabalho;", "D) Comete crime por frustração de direito as­ segurado por lei trabalhista;", "E) Comete crime de atentado contra a liberdade do contrato de trabalho."]}, {"id": "Q0011", "texto": "Com referência à interceptação de comunicação telefônica, ao crime de tráfico ilícito de entorpecentes, ao crime de lavagem de capitais e a crimes cibernéticos, julgue o seguinte item. Situação hipotética: Álvaro, servidor público federal, foi, por cinco anos, presidente da comissão de licitações de determinado órgão público federal. Em diversas ocasiões, Álvaro recebeu valores e bens para favorecer empresas nos certames licitatórios, e os transferiu para o patrimônio de Flávio, seu irmão, que os utilizava nos negócios da empresa da família, com vistas a ocultar o ingresso desses recursos e a sua origem ilícita. Assertiva : Nessa situação, Álvaro e Flávio responderão pelo crime de lavagem de capitais, e será da justiça federal a competência para processar e julgar a ação penal.", "comando": "Julgue o item apresentado.", "alternativas": ["C) Certo", "E) Errado"]}, {"id": "Q0270", "texto": "João conduzia o seu veículo automotor, ocasião em que foi parado por uma blitz da Polícia Militar. Após analisar a documentação do condutor, o policial Caio exigiu, para si, R$ 2.000,00 para liberar o automóvel. Nesse cenário, considerando as disposições do Código Penal, Caio responderá pelo crime de:", "comando": "", "alternativas": ["A) excesso de exação;", "B) corrupção passiva;", "C) corrupção ativa;", "D) concussão;", "E) peculato."]}], OPTIONS=["Criminologia > Classificação das Vítimas [4366]", "Criminologia > Classificação
